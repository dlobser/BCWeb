var STORY = {"title":"The Office of the Sheriff: The Bureaucracy of Shadows","entry":1,"vars":{"characters":["Mrs. O","Mr. D","Sheriff Harry Persad","Sheriff Sig Cho","Senior Receptionist","Archival Clerk","Whispering Citizen","Renegade Janitor","High Auditor","The Archivist","Chief Protocol Officer","Senior Registrar","Voice Behind Door","Unseen Third Sheriff","Narrator"],"locations":["Mr. D's House","Sheriff's Office Lobby","Waiting Room","Hall of Records","Endless Stairwell","Basement Archive","Forgotten Courtroom","Observation Hall","Sealed Corridor","Interview Room","Master Administrative Suite","The Reality Vault","Sub-Level 4 Security","Index of Nullified Timelines","Rooftop","Exit"],"collectibles":["sheriff_notice","visitor_badge","brass_key","clerk_stamp","obsidian_pass","black_token","master_ledger_page","unwritten_ink","archival_lantern"],"knowledge":["notice_pattern","stairwell_loop","reality_revision","true_names","archivist_secret","cosmic_protocol","vault_combination","ledger_location","fourth_sheriff_secret","exit_found"],"missions":["Expose the False Summons","Infiltrate the Lower Archive","Rescue the Erased Citizens","Decipher the Celestial Protocol","Reclaim Your Real Names","Overthrow the Revision Bureau"]},"varMeta":{"characters":{"Mrs. O":{"info":"an asian woman in her 50's, an accountant","image":"assets/characters/mrs-o-cutout.png","imageName":"mrs-o-cutout.png"},"Mr. D":{"info":"a 48 year old wild artist with long gray hair and shabby t shirt ","image":"assets/characters/mr-d-cutout.png","imageName":"mr-d-cutout.png"},"Sheriff Harry Persad":{"image":"assets/characters/sheriff-harry-persad-cutout.png","imageName":"sheriff-harry-persad-cutout.png"},"Sheriff Sig Cho":{"image":"assets/characters/sheriff-sig-cho-cutout.png","imageName":"sheriff-sig-cho-cutout.png"},"Senior Receptionist":{"image":"assets/characters/senior-receptionist-cutout.png","imageName":"senior-receptionist-cutout.png"},"Archival Clerk":{"image":"assets/characters/archival-clerk-cutout.png","imageName":"archival-clerk-cutout.png"},"Whispering Citizen":{"image":"assets/characters/whispering-citizen-cutout.png","imageName":"whispering-citizen-cutout.png"},"Renegade Janitor":{"image":"assets/characters/renegade-janitor-cutout.png","imageName":"renegade-janitor-cutout.png"},"High Auditor":{"image":"assets/characters/high-auditor-cutout.png","imageName":"high-auditor-cutout.png"},"The Archivist":{"image":"assets/characters/the-archivist-cutout.png","imageName":"the-archivist-cutout.png"},"Chief Protocol Officer":{"image":"assets/characters/chief-protocol-officer-cutout.png","imageName":"chief-protocol-officer-cutout.png"},"Senior Registrar":{"image":"assets/characters/senior-registrar-cutout.png","imageName":"senior-registrar-cutout.png"},"Voice Behind Door":{"image":"assets/characters/voice-behind-door-cutout.png","imageName":"voice-behind-door-cutout.png"},"Unseen Third Sheriff":{"image":"assets/characters/unseen-third-sheriff-cutout.png","imageName":"unseen-third-sheriff-cutout.png"},"Narrator":{"image":"assets/characters/narrator-cutout.png","imageName":"narrator-cutout.png"}},"locations":{"Mr. D's House":{"background":"assets/backgrounds/mr-d-s-house.png","backgroundName":"mr-d-s-house.png"},"Sheriff's Office Lobby":{"background":"assets/backgrounds/sheriff-s-office-lobby.png","backgroundName":"sheriff-s-office-lobby.png"},"Waiting Room":{"background":"assets/backgrounds/waiting-room.png","backgroundName":"waiting-room.png"},"Hall of Records":{"background":"assets/backgrounds/hall-of-records.png","backgroundName":"hall-of-records.png"},"Endless Stairwell":{"background":"assets/backgrounds/endless-stairwell.png","backgroundName":"endless-stairwell.png","audioLoop":""},"Basement Archive":{"background":"assets/backgrounds/basement-archive.png","backgroundName":"basement-archive.png"},"Forgotten Courtroom":{"background":"assets/backgrounds/forgotten-courtroom.png","backgroundName":"forgotten-courtroom.png"},"Observation Hall":{"background":"assets/backgrounds/observation-hall.png","backgroundName":"observation-hall.png"},"Sealed Corridor":{"background":"assets/backgrounds/sealed-corridor.png","backgroundName":"sealed-corridor.png"},"Interview Room":{"background":"assets/backgrounds/interview-room.png","backgroundName":"interview-room.png"},"Master Administrative Suite":{"background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png"},"The Reality Vault":{"background":"assets/backgrounds/the-reality-vault.png","backgroundName":"the-reality-vault.png"},"Sub-Level 4 Security":{"background":"assets/backgrounds/sub-level-4-security.png","backgroundName":"sub-level-4-security.png"},"Index of Nullified Timelines":{"background":"assets/backgrounds/index-of-nullified-timelines.png","backgroundName":"index-of-nullified-timelines.png"},"Rooftop":{"background":"assets/backgrounds/rooftop.png","backgroundName":"rooftop.png"},"Exit":{"background":"assets/backgrounds/exit.png","backgroundName":"exit.png"}}},"nodes":{"1":{"type":"dialogue","p":{"title":"The Notice on the Mahogany Door","location":"Mr. D's House","charactersPresent":"","text":"Narrator: Evening shadows stretch long across the quiet suburban street as Mr. D and Mrs. O return from their daily walk.\nNarrator: Taped precisely to the center of their mahogany front door is a thick parchment document sealed with heavy blue lead.\nNarrator: The seal bears an emblem of a pair of brass scales balancing an hourglass against a stack of filing cabinets.\nNarrator: OFFICE OF THE SHERIFF. MANDATORY APPEARANCE AND REALITY REVISION NOTICE.\nMrs. O: Look at the names printed at the top of the header... it's not just one of us. Both of our names are printed side-by-side in dark iron ink.\nMr. D: \"Case Pair 409. You are hereby instructed to present yourselves jointly at the District Courthouse, Floor 1, Desk B, between 9:00 AM and 5:00 PM.\"\nMrs. O: \"Failure to report as a unified pair will result in immediate retroactive nullification of marital records and personal identity schedules.\"\nMr. D: Retroactive nullification? They make it sound like our entire life together is an overdue library book.\nMrs. O: Look at the serving officers listed at the bottom... Sheriff Harry Persad and Sheriff Sig Cho.\nMr. D: I don't care how many sheriffs or clerks they have. We built our life together, line by line. No office is going to erase that.\nMrs. O: We go in together, we ask the hard questions together, and we leave together. Whatever this system is hiding, we uncover it.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/mr-d-s-house.png","backgroundName":"mr-d-s-house.png","showCharacterImages":true,"rewardItems":"sheriff_notice","rewardKnowledge":"notice_pattern","startMission":"Expose the False Summons","completeMission":"","isChapterStart":false},"out":[2]},"2":{"type":"choice","p":{"title":"Preparations at Home","location":"","background":"assets/backgrounds/mr-d-s-house.png","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Search the home study for older records and family heirlooms","condition":"","mission":""},{"text":"Attempt to dial the emergency dispatch number on the lead seal","condition":"","mission":""},{"text":"Gather your coats and head directly to the Sheriff's Office lobby","condition":"","mission":""}],"text":""},"out":[3,4,5]},"3":{"type":"dialogue","p":{"title":"The Hourglass Key","location":"Mr. D's House","charactersPresent":"","text":"Narrator: Mrs. O uses a brass hairpin to unlock the bottom drawer of their Victorian desk while Mr. D double-checks their old passports.\nNarrator: Beneath a stack of old land deeds lies a heavy iron box wrapped in faded velvet.\nNarrator: Inside rests a hand-carved brass key with a handle shaped like an hourglass, accompanied by an index card written in glowing silver ink.\nMr. D: I've owned this desk for twenty years, and I swear this box was never here yesterday.\nMrs. O: Read the card, Henry... it lists our original birth names from before we met, alongside dates that haven't happened yet.\nMr. D: \"Property of the Archival Sub-Levels. Master Key for File Pair 409.\"\nMrs. O: Whoever issued that notice has been cataloging our lives since before we even knew each other.\nMr. D: Slip the key into your coat pocket. If they have a vault downstairs, this key will unlock answers.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/mr-d-s-house.png","backgroundName":"mr-d-s-house.png","showCharacterImages":true,"rewardItems":"brass_key","rewardKnowledge":"true_names","startMission":"","completeMission":"","isChapterStart":false},"out":[5]},"4":{"type":"dialogue","p":{"title":"The Static Dispatch Call","location":"Mr. D's House","charactersPresent":"","text":"Narrator: Mr. D lifts the heavy rotary phone receiver and dials the eleven-digit number stamped into the lead seal.\nNarrator: After a single ring, a sharp, monotone voice answers amidst the sound of thousands of pages rustling in a heavy wind.\nSenior Receptionist: Sheriff's Office, Division of Marital Audits. State your Case Pair ID.\nMr. D: We are calling about a notice left on our door for Mr. D and Mrs. O. Case Pair 409.\nSenior Receptionist: Ah, Case 409. The persistent anomaly pair. We have been monitoring your temporal cohesion metrics since Tuesday.\nMrs. O: What do you mean by anomaly pair? We're a married couple!\nSenior Receptionist: Most couples begin disputing shared memories within six minutes of receiving a revision notice. Your metrics remain inconveniently synchronized.\nMr. D: We aren't disputing anything. We demand to know what authority you have over our lives.\nSenior Receptionist: Authority is delegated by the High Auditor. Please report between nine and five before your file is shredded.\nNarrator: The line drops into a harsh burst of static that sounds like a choir whispering legal citations in unison.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/mr-d-s-house.png","backgroundName":"mr-d-s-house.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"notice_pattern","startMission":"","completeMission":"","isChapterStart":false},"out":[5]},"5":{"type":"dialogue","p":{"title":"Arrival at the Monolithic Courthouse","location":"Sheriff's Office Lobby","charactersPresent":"","text":"Narrator: The Sheriff's Office occupies an imposing granite courthouse that looms five stories higher than the surrounding city buildings.\nNarrator: Inside the lobby, the ceiling stretches into shadow, and massive brass wall clocks tick counter-clockwise at irregular intervals.\nNarrator: Behind a waist-high marble counter sits the Senior Receptionist, systematically stamping stack after stack of grey manila folders.\nSenior Receptionist: Welcome to Floor 1, Case Pair 409. Please attach these brass visitor badges to your lapels immediately.\nMr. D: We want to speak with whoever issued this notice.\nSenior Receptionist: Everyone wants to speak with the issuers, sir. But the sheriffs do not handle inquiries; they handle execution of revisions.\nMrs. O: We aren't leaving until we inspect our file.\nSenior Receptionist: Your file is currently descending toward the Basement Archive for evening processing. If you wish to catch it, I suggest you move quickly.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sheriff-s-office-lobby.png","backgroundName":"sheriff-s-office-lobby.png","showCharacterImages":true,"rewardItems":"visitor_badge","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[6]},"6":{"type":"choice","p":{"title":"Lobby Navigation Strategy","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Demand an immediate formal interview with Sheriff Harry Persad","condition":"","mission":""},{"text":"Intercept Sheriff Sig Cho in the interview corridor","condition":"","mission":""},{"text":"Discreetly mingle with the waiting citizens in the lobby","condition":"","mission":""},{"text":"Use the brass key to unlock the restricted sub-level archive door","condition":"has_item('brass_key')","mission":"Infiltrate the Lower Archive"}],"text":""},"out":[7,8,9,12]},"7":{"type":"dialogue","p":{"title":"Interview with Sheriff Harry Persad","location":"Interview Room","charactersPresent":"","text":"Sheriff Harry Persad: Please sit, Mr. D, Mrs. O. I must say, your file is causing quite a stir in the Revision Bureau.\nMrs. O: Why? What is wrong with our records?\nSheriff Harry Persad: Nothing is wrong with your records, madam. That is the problem. Your lives match the 1994 master census perfectly.\nMr. D: Then why issue a revision notice?\nSheriff Harry Persad: Because the 1994 master census was declared non-canonical three hours ago. We are retroactively adjusting all citizen pairings from that era.\nMrs. O: You can't just declare a decade non-canonical!\nSheriff Harry Persad: We do it twice a month, Mrs. O. Bureaucracy requires constant pruning to keep reality manageable.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/interview-room.png","backgroundName":"interview-room.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"reality_revision","startMission":"","completeMission":"","isChapterStart":false},"out":[10]},"8":{"type":"dialogue","p":{"title":"Interview with Sheriff Sig Cho","location":"Interview Room","charactersPresent":"","text":"Narrator: Sheriff Sig Cho stands near a tall stained-glass window that looks out onto an empty gray void where the street should be.\nNarrator: He slowly polishes a heavy steel stamping rod engraved with the word NULLIFIED.\nSheriff Sig Cho: I admire couples like you. So determined, so attached to your personal continuity.\nMr. D: We aren't going to let you rewrite our past.\nSheriff Sig Cho: You misunderstand your position. Your past has already been rewritten four times. You simply haven't noticed the seam lines yet.\nMrs. O: What seam lines?\nSheriff Sig Cho: Have you ever looked at your wedding album and felt like the weather was slightly different than you remembered? That was our third draft.\nMr. D: This ends today, Sheriff. We're finding the master ledger.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/interview-room.png","backgroundName":"interview-room.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"reality_revision","startMission":"","completeMission":"","isChapterStart":false},"out":[10]},"9":{"type":"dialogue","p":{"title":"The Whispering Citizen's Warning","location":"Waiting Room","charactersPresent":"","text":"Narrator: Mrs. O and Mr. D take seats on a hard oak bench beside a thin, pale man wearing three coats over one another.\nNarrator: The man continuously checks a pocket watch that has no hands, only a small mirror inside the face.\nWhispering Citizen: Don't let the clerks separate you into Room A and Room B. That's how they broke my parents.\nMrs. O: How do they break people?\nWhispering Citizen: They give Room A a file that says Room B never existed. Then they give Room B a file that says Room A died ten years ago. Once you doubt each other for a second, the building absorbs your names.\nMr. D: We trust each other completely.\nWhispering Citizen: Then go to the sub-levels. Find the old Archivist before the High Auditor signs the daily shredding order.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/waiting-room.png","backgroundName":"waiting-room.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"archivist_secret","startMission":"","completeMission":"","isChapterStart":false},"out":[10]},"10":{"type":"choice","p":{"title":"Choosing the Infiltration Arc","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Infiltrate the Master Administrative Suite on Floor 3","condition":"","mission":"Infiltrate the Lower Archive"},{"text":"Descend into the Endless Stairwell toward the Basement Archive","condition":"","mission":"Infiltrate the Lower Archive"},{"text":"Sneak into the Forgotten Courtroom to inspect the active dockets","condition":"","mission":"Expose the False Summons"}],"text":""},"out":[11,12,13]},"11":{"type":"traversal","p":{"title":"Administrative Suite Infiltration","location":"Master Administrative Suite","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":65,"outcomes":[{"label":"Auditor Patrol Evasion","probability":35,"description":"You slip past the patrolling bailiffs into the Stamp Registry."},{"label":"Senior Registrar Interception","probability":35,"description":"A registrar confronts you, but you bluff your way through."},{"label":"Sanctum Breach","probability":30,"description":"You locate the High Auditor's inner office."}],"text":""},"out":[6,14,15,16,5]},"12":{"type":"traversal","p":{"title":"Endless Stairwell Descent","location":"Endless Stairwell","background":"assets/backgrounds/endless-stairwell.png","backgroundName":"endless-stairwell.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":70,"outcomes":[{"label":"Archive Floor Landing","probability":40,"description":"You reach the cavernous floor of the Basement Archive."},{"label":"Holding Cell Block","probability":30,"description":"You stumble into the high"},{"label":"Reality Vault Threshold","probability":30,"description":"You emerge directly before the blast doors of the Reality Vault."}],"text":""},"out":[10,21,null,23,5]},"13":{"type":"dialogue","p":{"title":"The Forgotten Courtroom Docket","location":"Forgotten Courtroom","charactersPresent":"","text":"Narrator: High vaulted ceilings echo with the sound of a mechanical typewriter typing continuously without a clerk present.\nNarrator: Rows of empty wooden pews face a massive judicial dais where three leather-bound dockets lie open.\nArchival Clerk: Case Pair 409 is scheduled for Docket Removal at 17:00 hours.\nMrs. O: Not if we have anything to say about it.\nMr. D: Look at the judge's dais... it lists the Celestial Protocol rules.\nMrs. O: \"Section 9: Any reality revision may be challenged if the subjects present an original Unwritten Ledger entry signed by both parties.\"\nMr. D: That means if we find the Unwritten Ink, we can legally void their revision notice right here!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/forgotten-courtroom.png","backgroundName":"forgotten-courtroom.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"cosmic_protocol","startMission":"","completeMission":"","isChapterStart":false},"out":[10]},"14":{"type":"dialogue","p":{"title":"Evading the Bailiff Guards","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: Heavy iron boots clatter against the marble floor as three tall bailiffs carry glowing brass stamping rods down the hallway.\nNarrator: Mr. D quickly pulls Mrs. O into an alcove concealed behind a heavy velvet tapestry depicting the founding of the Revision Bureau.\nMr. D: Those stamping rods... if a guard touches you with one, it reclassifies your citizen tier on the spot.\nMrs. O: Look across the hall... there's a heavy oak door marked \"CLERK STAMP REGISTRY.\"\nMr. D: Wait until the lead guard turns the corner... now! Move!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"stairwell_loop","startMission":"","completeMission":"","isChapterStart":false},"out":[15]},"15":{"type":"dialogue","p":{"title":"The Stamp Registry Vault","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: The room is filled from floor to ceiling with wooden racks holding thousands of heavy iron stamps.\nNarrator: Each stamp bears a word in raised steel letters: APPROVED, REVISED, SHREDDED, EXPUNGED, REASSIGNED.\nMrs. O: Look at this massive brass seal in the velvet display case... \"RECLASSIFIED MASTER CLEARANCE.\"\nMr. D: If we take that stamp, we can forge official authorization passes to access any restricted vault in the building.\nMrs. O: Press it onto a blank parchment sheet... perfect. Now we hold the authority of a Senior Registrar.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"clerk_stamp","rewardKnowledge":"reality_revision","startMission":"","completeMission":"","isChapterStart":false},"out":[17]},"16":{"type":"dialogue","p":{"title":"The High Auditor's Office","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: Inside a glass-walled office overlooking the entire administrative floor, the High Auditor sits at a desk made of compressed legal documents.\nHigh Auditor: Case Pair 409. You are trespassing in the Executive Revision Sector.\nMr. D: We are here to reclaim our records, Auditor.\nHigh Auditor: Your records are property of the Revision Bureau! Without constant administrative maintenance, human lives collapse into narrative chaos!\nMrs. O: Our life is not narrative chaos; it's our marriage!\nNarrator: Mrs. O glances at the Auditor's blotter and notes a set of numbers carved into the leather: 7-14-21.\nMr. D: That's the combination to the Reality Vault downstairs!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"vault_combination","startMission":"","completeMission":"","isChapterStart":false},"out":[17]},"17":{"type":"logic","p":{"title":"Stamp Authorization Check","condition":"has_item('clerk_stamp')","location":"","text":""},"out":[18,19]},"18":{"type":"dialogue","p":{"title":"Forging the Master Clearance Pass","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: Using the stolen clerk stamp, Mrs. O firmly presses the heavy seal onto a sheet of gold-leaf document paper.\nNarrator: The gold leaf flashes with bright blue light as the text automatically reconfigures into a Master Clearance Directive.\nMr. D: Outstanding work, Henry. Now no guard or clerk in this building can block us.\nMrs. O: Let's head straight down to the sub-levels and find the Master Ledger before sundown.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"cosmic_protocol","startMission":"","completeMission":"Infiltrate the Lower Archive","isChapterStart":false},"out":[20]},"19":{"type":"dialogue","p":{"title":"The Renegade Janitor's Refuge","location":"Sealed Corridor","charactersPresent":"","text":"Narrator: Red alarm lights flash along the ceiling as a loud buzzer sounds down the corridor.\nNarrator: A door to a supply closet swings open, and a man in greasy gray overalls pulls Mrs. O and Mr. D inside.\nRenegade Janitor: Quiet! The bailiffs are conducting a sweep of Sector 4.\nMr. D: Who are you?\nRenegade Janitor: I used to be a Senior Registrar until they erased my home town in '02. I've been living in the ventilation shafts ever since, sabotaging their paper shredders.\nMrs. O: There are people locked in the cells down here!\nRenegade Janitor: Aye, cell block 3 is full of citizens whose files are half-shredded. Help me get them out, and I'll show you the secret path to the Archivist.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sealed-corridor.png","backgroundName":"sealed-corridor.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"archivist_secret","startMission":"Rescue the Erased Citizens","completeMission":"","isChapterStart":false},"out":[20]},"20":{"type":"choice","p":{"title":"Sub-Level Descent Choices","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Descend directly to the Basement Archive Floor","condition":"","mission":""},{"text":"Assist the Renegade Janitor in unlocking Cell Block 3","condition":"","mission":"Rescue the Erased Citizens"},{"text":"Use the vault combination to open the Reality Vault","condition":"has_knowledge('vault_combination')","mission":"Reclaim Your Real Names"},{"text":"Enter the Sub-Level Crossroads to inspect the security sub-vaults","condition":"","mission":""},{"text":"Use the clerk stamp to unseal secret Revision Bureau memos","condition":"has_item('clerk_stamp')","mission":""}],"text":""},"out":[21,22,23,40,47]},"21":{"type":"traversal","p":{"title":"Basement Archive Navigation","location":"Basement Archive","background":"assets/backgrounds/basement-archive.png","backgroundName":"basement-archive.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":70,"outcomes":[{"label":"Filing Cabinet Shift","probability":30,"description":"Moving shelves reveal a hidden passage to the Master Files."},{"label":"Chamber of Floating Records","probability":35,"description":"You enter a vast cavern where memory cards float like lanterns."},{"label":"The Archivist's Desk","probability":35,"description":"You locate the quiet sanctuary of the Chief Archivist."}],"text":""},"out":[10,24,25,26,5]},"22":{"type":"dialogue","p":{"title":"Liberation of Cell Block 3","location":"Sealed Corridor","charactersPresent":"","text":"Narrator: Mr. D uses a heavy iron crowbar to shatter the brass padlock securing the door of Cell Block 3.\nNarrator: Inside sit dozens of men and women whose bodies are semi-translucent, their faces glowing faintly with lost memories.\nWhispering Citizen: You... you can actually see us? The clerks said we were completely nullified!\nMrs. O: No one is nullified here! Get up, all of you! We're breaking out of this building together!\nRenegade Janitor: Take these floor plans! They show the emergency stairwell leading straight up to the rooftop exit!\nMr. D: Lead the citizens to the rooftop stairs! We'll secure the master files so they can never erase you again!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sealed-corridor.png","backgroundName":"sealed-corridor.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"true_names","startMission":"","completeMission":"Rescue the Erased Citizens","isChapterStart":false},"out":[21]},"23":{"type":"dialogue","p":{"title":"The Reality Vault Threshold","location":"The Reality Vault","charactersPresent":"","text":"Narrator: At the end of a heavily reinforced hallway stands a circular steel vault door ten feet thick, fitted with three brass dials and a central obsidian slot.\nNarrator: In the central slot rests a smooth black stone token that emits a freezing mist.\nMr. D: This is the Black Token... the physical core that powers the building's reality engine.\nMrs. O: If we pull this token out, their automated shredders and revision stamps will freeze instantly!\nNarrator: Mrs. O grips the cold obsidian token and pulls it free. The massive vault door groans as power surges through the floor.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/the-reality-vault.png","backgroundName":"the-reality-vault.png","showCharacterImages":true,"rewardItems":"black_token","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[26]},"24":{"type":"dialogue","p":{"title":"Finding the Master Ledger Page","location":"Basement Archive","charactersPresent":"","text":"Narrator: Behind a collapsed row of oak filing cabinets sits a pedestal holding a glowing glass case.\nNarrator: Inside lies a single yellowed sheet of parchment labeled: MASTER LEDGER - CASE PAIR 409.\nMr. D: Look at section 4... \"Anomalous marital bond exhibits 99.8% structural resistance to standard erasure protocols.\"\nMrs. O: They didn't summon us because we were a mistake... they summoned us because our love is stronger than their entire system!\nMr. D: Take the page out of the case. Without this original document, they can't execute the evening revision!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/basement-archive.png","backgroundName":"basement-archive.png","showCharacterImages":true,"rewardItems":"master_ledger_page","rewardKnowledge":"reality_revision","startMission":"","completeMission":"","isChapterStart":false},"out":[26]},"25":{"type":"dialogue","p":{"title":"The Chamber of Floating Memories","location":"Basement Archive","charactersPresent":"","text":"Narrator: The cavernous room has no floor or ceiling, only floating wooden index drawers suspended in midair.\nNarrator: As Mrs. O touches a floating drawer, a warm beam of golden light projects a vivid memory of the rainy afternoon when Mr. D proposed.\nMrs. O: Look, Henry... they didn't just record our dates and addresses. They harvested the actual feelings.\nMr. D: They use human love as the fuel to power their administrative engine.\nMrs. O: Then we're going to shut down their fuel supply forever.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/basement-archive.png","backgroundName":"basement-archive.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"cosmic_protocol","startMission":"","completeMission":"","isChapterStart":false},"out":[26]},"26":{"type":"dialogue","p":{"title":"Audience with the Chief Archivist","location":"Basement Archive","charactersPresent":"","text":"Narrator: In a quiet, book-lined study lit by green shaded lamps, an ancient man in spectacles sits writing with a peacock feather quill.\nThe Archivist: Ah, Case Pair 409. I have watched your file for forty years.\nMr. D: Are you the one who ordered our revision?\nThe Archivist: I order nothing, young man. I merely archive what the High Auditor demands. But I have grown weary of watching beautiful lives shredded for bureaucratic symmetry.\nMrs. O: Then help us destroy their authority.\nThe Archivist: Take this crystal bottle of Unwritten Ink. Anything written with this ink becomes permanent, unalterable reality across all timelines.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/basement-archive.png","backgroundName":"basement-archive.png","showCharacterImages":true,"rewardItems":"unwritten_ink","rewardKnowledge":"archivist_secret","startMission":"","completeMission":"Expose the False Summons","isChapterStart":false},"out":[27]},"27":{"type":"choice","p":{"title":"The Strategic Decision of the Ink","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Use the Unwritten Ink to rewrite the Master Ledger page directly","condition":"has_item('master_ledger_page')","mission":"Reclaim Your Real Names"},{"text":"Confront Sheriff Harry Persad and Sheriff Sig Cho in the Forgotten Courtroom","condition":"","mission":"Decipher the Celestial Protocol"},{"text":"Lead the freed citizens up to the Rooftop for an immediate exit","condition":"","mission":"Reclaim Your Real Names"},{"text":"Infiltrate Sub-Level 4 Security to trigger a complete system override","condition":"has_item('black_token')","mission":""},{"text":"Enter the Index of Nullified Timelines to recover lost civilian records","condition":"","mission":"Overthrow the Revision Bureau"}],"text":""},"out":[28,29,30,41,51]},"28":{"type":"dialogue","p":{"title":"Rewriting the Master Ledger","location":"Hall of Records","charactersPresent":"","text":"Narrator: Mrs. O uncorks the bottle of Unwritten Ink and dips the peacock feather quill into the shimmering liquid.\nNarrator: Across the Master Ledger page for Case Pair 409, she writes in bold, confident letters:\nMrs. O: \"Mr. D and Mrs. O are permanently, eternally immune to administrative revision. Their marriage is absolute, unwritten, and unerasable.\"\nNarrator: As the ink touches the parchment, brilliant golden light flares across the room.\nMr. D: Look at the stone walls... the grey courthouse architecture is dissolving back into warm sunlit air!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/hall-of-records.png","backgroundName":"hall-of-records.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"true_names","startMission":"","completeMission":"Reclaim Your Real Names","isChapterStart":false},"out":[31]},"29":{"type":"dialogue","p":{"title":"Confrontation in the Courtroom","location":"Forgotten Courtroom","charactersPresent":"","text":"Narrator: Heavy oak doors slam shut behind Mrs. O and Mr. D as they step into the center aisle of the Forgotten Courtroom.\nNarrator: High on the judicial bench stand Sheriff Harry Persad and Sheriff Sig Cho, their stamping rods glowing with angry purple light.\nSheriff Harry Persad: You are in violation of the Celestial Protocol, Case Pair 409!\nSheriff Sig Cho: Surrender your files immediately or face total narrative dissolution!\nMr. D: We surrender nothing to unauthorized clerks!\nMrs. O: We hold the Unwritten Ink and the Black Token. Your jurisdiction is revoked!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/forgotten-courtroom.png","backgroundName":"forgotten-courtroom.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"cosmic_protocol","startMission":"Decipher the Celestial Protocol","completeMission":"","isChapterStart":false},"out":[32]},"30":{"type":"dialogue","p":{"title":"The Rooftop Ascent","location":"Rooftop","charactersPresent":"","text":"Narrator: The heavy iron door at the top of the stairwell bursts open, letting in cold wind and the bright golden light of sunset.\nNarrator: Below them, the sprawling city skyline looks clearer and more real than ever before.\nRenegade Janitor: Look! The courthouse building is shrinking! The citizens are pouring out into the street below!\nMrs. O: We did it, Henry. The whole building is breaking apart!\nMr. D: Let me hold your hand as we walk down to the street. We're going home.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/rooftop.png","backgroundName":"rooftop.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"exit_found","startMission":"","completeMission":"","isChapterStart":false},"out":[33]},"31":{"type":"logic","p":{"title":"Master Ledger Verification","condition":"has_item('unwritten_ink') has_knowledge('true_names')","location":"","text":""},"out":[34,35]},"32":{"type":"logic","p":{"title":"Celestial Protocol Audit","condition":"has_item('black_token') has_knowledge('cosmic_protocol')","location":"","text":""},"out":[36,37]},"33":{"type":"logic","p":{"title":"Rooftop Escape Verification","condition":"has_knowledge('exit_found') has_item('master_ledger_page')","location":"","text":""},"out":[38,39]},"34":{"type":"dialogue","p":{"title":"Ending - Authors of Reality","location":"Mr. D's House","charactersPresent":"","text":"Narrator: With the Unwritten Ink, Mrs. O and Mr. D rewrite the entire bureaucratic system out of existence.\nNarrator: They wake up in their own sunlit bedroom. The notice on the front door has vanished completely.\nMrs. O: Do you feel any different, Henry?\nMr. D: I feel like our past belongs to us now. Completely, permanently, and forever.\nNarrator: Together, they step outside onto their porch, ready to live a life written entirely by their own hands.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/mr-d-s-house.png","backgroundName":"mr-d-s-house.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"Reclaim Your Real Names","isChapterStart":false},"out":[]},"35":{"type":"dialogue","p":{"title":"Ending - The Permanent Resistance","location":"Interview Room","charactersPresent":"","text":"Narrator: Without their true birth names, the Unwritten Ink only partially shields them from bureaucratic oversight.\nNarrator: Every year, Sheriff Harry Persad and Sheriff Sig Cho return to offer a new compromise.\nSheriff Harry Persad: Sign here to extend your memory permits for another decade.\nMrs. O: We will sign nothing that alters our love.\nMr. D: We remain together, fighting the bureau step by step, unyielding and untamed.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/interview-room.png","backgroundName":"interview-room.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[]},"36":{"type":"dialogue","p":{"title":"Ending - Overthrow of the Sheriffs","location":"Forgotten Courtroom","charactersPresent":"","text":"Narrator: Mr. D places the Black Token onto the judge's gavel stand.\nNarrator: A blinding pulse of white light shatters the gavels held by Sheriff Harry Persad and Sheriff Sig Cho.\nSheriff Sig Cho: Impossible... the Celestial Protocol has been overridden!\nSheriff Harry Persad: The office... is dissolved!\nNarrator: The courtroom crumbles into dust as Mrs. O and Mr. D walk out as victors over the cosmic bureaucracy.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/forgotten-courtroom.png","backgroundName":"forgotten-courtroom.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"Decipher the Celestial Protocol","isChapterStart":false},"out":[]},"37":{"type":"dialogue","p":{"title":"Ending - Eternal Guardians of Memory","location":"Observation Hall","charactersPresent":"","text":"Narrator: Lacking full cosmic protocol knowledge, the Black Token creates a temporal lock.\nNarrator: The Sheriff's Office freezes in time around them.\nMrs. O: The sheriffs can't touch us, but we can't leave either.\nMr. D: Then we stand guard together forever, protecting humanity from revision.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/observation-hall.png","backgroundName":"observation-hall.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[]},"38":{"type":"dialogue","p":{"title":"Ending - The Great Emancipation","location":"Exit","charactersPresent":"","text":"Narrator: Carrying the Master Ledger page, Mrs. O and Mr. D lead hundreds of freed citizens out into the city streets.\nNarrator: As the citizens step into the sunlight, their names and histories instantly restore.\nRenegade Janitor: You saved us all!\nMrs. O: We saved each other.\nNarrator: Hand in hand, Mr. D and Mrs. O lead the newly freed populace into a bright, unscripted future.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/exit.png","backgroundName":"exit.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"Reclaim Your Real Names","isChapterStart":false},"out":[]},"39":{"type":"dialogue","p":{"title":"Ending - Quiet Freedom","location":"Exit","charactersPresent":"","text":"Narrator: Though they didn't retrieve the Master Ledger page, their escape disrupts the local office's jurisdiction.\nNarrator: They slip into the crowd of the city, anonymous and united.\nMr. D: The office may still be out there somewhere.\nMrs. O: Let them come. As long as we're together, they can never erase us.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/exit.png","backgroundName":"exit.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[]},"40":{"type":"choice","p":{"title":"Sub-Level 4 Security Crossroads","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Proceed directly into the Vault Security Chamber","condition":"","mission":""},{"text":"Use the High Auditor's combination to unlock the Master Core","condition":"has_knowledge('vault_combination')","mission":""},{"text":"Return to the Master Administrative Suite to counter-audit the records","condition":"","mission":""}],"text":""},"out":[41,43,15]},"41":{"type":"dialogue","p":{"title":"The Vault Security Chamber","location":"Sub-Level 4 Security","charactersPresent":"","text":"Narrator: High-voltage copper conduits hum along the dark stone walls of Sub-Level 4.\nVoice Behind Door: Unauthorized entry detected. Case Pair 409 identity purge commencing in three minutes.\nMr. D: Look at the central control console... it has an obsidian slot for the Black Token!\nMrs. O: If we insert the Black Token, it will short-circuit their master memory core and restore everyone's original lives!\nVoice Behind Door: Warning. Core reset will permanently delete the Revision Bureau.\nMr. D: Good. That's exactly why we're here.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sub-level-4-security.png","backgroundName":"sub-level-4-security.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"vault_combination","startMission":"","completeMission":"","isChapterStart":false},"out":[42]},"42":{"type":"choice","p":{"title":"Core Override Execution","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Insert the Black Token into the Master Core console","condition":"has_item('black_token')","mission":""},{"text":"Use the Unwritten Ink to reprogram the core matrix","condition":"has_item('unwritten_ink')","mission":""}],"text":""},"out":[44,28]},"43":{"type":"dialogue","p":{"title":"Deciphering the Vault Lock","location":"Sub-Level 4 Security","charactersPresent":"","text":"Narrator: Mr. D steps up to the brass combination dials and carefully enters the sequence 7-14-21 found in the Auditor's office.\nVoice Behind Door: Combination accepted. Executive Override Mode activated.\nNarrator: The massive blast doors slide into the floor, revealing the glowing crystal heart of the building's reality engine.\nMrs. O: Look at the crystal... it's pulsing with gold light!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sub-level-4-security.png","backgroundName":"sub-level-4-security.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"cosmic_protocol","startMission":"","completeMission":"","isChapterStart":false},"out":[44]},"44":{"type":"logic","p":{"title":"Core Reset Authorization Check","condition":"has_item('black_token') has_knowledge('vault_combination')","location":"","text":""},"out":[45,41]},"45":{"type":"dialogue","p":{"title":"The High Auditor's Surrender","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: The High Auditor drops his silver quill as alarms blare across every floor of the building.\nHigh Auditor: You... you have reversed the master clock! All pending revision orders have been voided!\nMr. D: Your bureau has no power over people who know who they are.\nMrs. O: Effective immediately, the Revision Bureau is permanently closed.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"true_names","startMission":"","completeMission":"","isChapterStart":false},"out":[46]},"46":{"type":"choice","p":{"title":"Final Counter-Audit Protocol","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Issue a district-wide Counter-Audit Directive","condition":"","mission":""},{"text":"Escort the freed citizens to the rooftop exit","condition":"","mission":""}],"text":""},"out":[48,30]},"47":{"type":"dialogue","p":{"title":"Exposing Secret Revision Bureau Memos","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: Mrs. O uses the stolen clerk stamp to break the lead seal on a black leather folder marked TOP SECRET: DISTRICT AUDIT.\nMrs. O: Henry, look at this memo signed by Sheriff Harry Persad and Sheriff Sig Cho... \"The Revision Bureau is an unauthorized rogue department operating without municipal approval.\"\nMr. D: They aren't cosmic judges! They're just rogue archivists who stole an old reality engine!\nMrs. O: Now we have the proof we need to shut them down forever!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"reality_revision","startMission":"","completeMission":"","isChapterStart":false},"out":[49]},"48":{"type":"dialogue","p":{"title":"Executing the Counter-Audit Directive","location":"Master Administrative Suite","charactersPresent":"","text":"Narrator: Mr. D firmly presses the clerk stamp onto the Master Counter-Audit Directive.\nNarrator: A wave of golden light ripples out from the desk, washing down every corridor and dissolving every lead notice in the city.\nMrs. O: It's over, Henry. The whole system has been shut down!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/master-administrative-suite.png","backgroundName":"master-administrative-suite.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"archivist_secret","startMission":"","completeMission":"","isChapterStart":false},"out":[50]},"49":{"type":"logic","p":{"title":"Counter-Audit Proof Check","condition":"has_item('clerk_stamp') has_knowledge('reality_revision')","location":"","text":""},"out":[48,19]},"50":{"type":"dialogue","p":{"title":"Ending - System Administrators of Freedom","location":"Exit","charactersPresent":"","text":"Narrator: The monolithic granite courthouse melts away like snow, turning into a bright public park filled with blooming trees.\nNarrator: Sheriff Harry Persad and Sheriff Sig Cho vanish like shadows under a midday sun.\nMr. D: We didn't just defeat their office... we gave everyone their lives back.\nMrs. O: And no clerk will ever try to write our story again.\nNarrator: Hand in hand, Mr. D and Mrs. O walk together out of the park and back to their home.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/exit.png","backgroundName":"exit.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"Expose the False Summons","isChapterStart":false},"out":[]},"51":{"type":"dialogue","p":{"title":"The Index of Nullified Timelines","location":"Index of Nullified Timelines","charactersPresent":"","text":"Narrator: Below the Basement Archive lies a cold cavern illuminated by floating blue lanterns.\nNarrator: Countless leather-bound volumes rest on iron shelves stretching into infinity.\nSenior Registrar: You shouldn't be down here, Case 409. This is where erased years go to rot.\nMr. D: Take this Archival Lantern, Mrs. O. Its light reveals text written in invisible lead ink.\nMrs. O: Look at this shelf... \"The Unseen Third Sheriff.\" It says there isn't just Persad and Cho... there is a third sheriff who operates in secret!\nMr. D: Then we uncover the Third Sheriff before we trigger the system reset!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/index-of-nullified-timelines.png","backgroundName":"index-of-nullified-timelines.png","showCharacterImages":true,"rewardItems":"archival_lantern","rewardKnowledge":"fourth_sheriff_secret","startMission":"Overthrow the Revision Bureau","completeMission":"","isChapterStart":false},"out":[52]},"52":{"type":"choice","p":{"title":"Navigating the Nullified Index","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Search for the Bureau of Lost Marriages ledger","condition":"","mission":""},{"text":"Confront the Chief Protocol Officer guarding the lower core","condition":"","mission":""},{"text":"Seek out the refuge of the Unseen Third Sheriff","condition":"has_knowledge('fourth_sheriff_secret')","mission":""}],"text":""},"out":[54,57,69]},"54":{"type":"dialogue","p":{"title":"The Bureau of Lost Marriages","location":"Index of Nullified Timelines","charactersPresent":"","text":"Narrator: In a dusty circular chamber, thousands of wedding rings float in glass jars, each labeled with a erased citizen ID.\nChief Protocol Officer: Stand back! These records are property of the District Auditor!\nMrs. O: These aren't records; these are people's lives and memories!\nMr. D: We hold the Master Clearance Stamp. Stand down, Officer!\nChief Protocol Officer: Your stamp cannot override the Chief Protocol... unless you hold the Obsidian Pass!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/index-of-nullified-timelines.png","backgroundName":"index-of-nullified-timelines.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"ledger_location","startMission":"","completeMission":"","isChapterStart":false},"out":[55]},"55":{"type":"choice","p":{"title":"Resolving the Protocol Officer Standoff","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Use the Unwritten Ink to overwrite the Chief Protocol","condition":"has_item('unwritten_ink')","mission":""},{"text":"Use the Archival Lantern to reveal the Officer's real birth name","condition":"has_item('archival_lantern')","mission":""},{"text":"Retreat to Sub-Level 4 Security to trigger the core reset","condition":"","mission":""}],"text":""},"out":[57,59,41]},"57":{"type":"dialogue","p":{"title":"Unmasking the Protocol Officer","location":"Index of Nullified Timelines","charactersPresent":"","text":"Narrator: As Mrs. O shines the Archival Lantern onto the Officer's silver badge, glowing letters appear across his chest.\nMrs. O: Your name isn't Chief Protocol Officer... your name is Arthur Vance! You were erased in 1988!\nChief Protocol Officer: I... I had a name? A real name?\nMr. D: The Bureau erased your life and forced you to guard their files. Join us, Arthur!\nChief Protocol Officer: Take this Obsidian Pass... it unlocks the chamber of the Unseen Third Sheriff!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/index-of-nullified-timelines.png","backgroundName":"index-of-nullified-timelines.png","showCharacterImages":true,"rewardItems":"obsidian_pass","rewardKnowledge":"cosmic_protocol","startMission":"","completeMission":"","isChapterStart":false},"out":[59]},"59":{"type":"dialogue","p":{"title":"The Sanctuary of the Unseen Sheriff","location":"Observation Hall","charactersPresent":"","text":"Narrator: Behind a heavy bronze door sits a quiet room filled with brass telescopes pointing up at the night sky.\nNarrator: In a high leather chair sits the Unseen Third Sheriff, holding a silver pocket watch.\nUnseen Third Sheriff: Thank you for coming, Case Pair 409. I have been waiting fifty years for a couple strong enough to breach this floor.\nMrs. O: Are you here to revise us too?\nUnseen Third Sheriff: No. I am here to witness the moment human devotion destroys our artificial machinery. Take my watch... it unlocks the final counter-audit directive!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/observation-hall.png","backgroundName":"observation-hall.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"fourth_sheriff_secret","startMission":"","completeMission":"Overthrow the Revision Bureau","isChapterStart":false},"out":[60]},"60":{"type":"logic","p":{"title":"Unseen Sheriff Verification","condition":"has_item('obsidian_pass') has_knowledge('fourth_sheriff_secret')","location":"","text":""},"out":[48,41]},"69":{"type":"dialogue","p":{"title":"Ending - Sovereignty of Memory","location":"Observation Hall","charactersPresent":"","text":"Narrator: Guided by the Unseen Third Sheriff, Mrs. O and Mr. D use the pocket watch to reset the building's timeline core.\nNarrator: The courthouse silently folds into a single sheet of blank paper, leaving only the sky and stars above.\nMrs. O: We did it, Henry. They can never erase anyone again.\nMr. D: Our memories, our names, our marriage... belong to us forever.\nNarrator: Together, they walk out into a free and unwritten world under the starlight.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/observation-hall.png","backgroundName":"observation-hall.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"Overthrow the Revision Bureau","isChapterStart":false},"out":[]}}};

.sp-ending-title { font-family:'EB Garamond',Georgia,serif; font-size:30px; color:#34d399; margin-bottom:14px; }
.sp-ending-text { font-family:'EB Garamond',Georgia,serif; font-size:17px; color:#cbd5e1; line-height:1.6; margin-bottom:24px; }
.sp-ending-actions { display:flex; gap:12px; justify-content:center; }

.sp-char-container { display:flex; justify-content:center; align-items:flex-end; width:min(860px, 92%); height:240px; pointer-events:none; margin-bottom:12px; z-index:5; }
.sp-char-img { max-height:100%; max-width:33%; object-fit:contain; animation:spSlideUp .4s ease; }
@keyframes spSlideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
`;

  constructor(container, story, opts = {}) {
    this.container = container;
    this.story = story || { nodes: {}, vars: {}, entry: null };
    this.opts = opts; // { onExit: fn, standalone: bool }
    this.state = null;
    this._loopAudio = null;
    this._loopSrc = null;
    this._fadeTimer = null;
    this._begun = false;
    this._injectStyles();
  }

  _injectStyles() {
    if (document.getElementById("sp-player-styles")) return;
    const s = document.createElement("style");
    s.id = "sp-player-styles";
    s.textContent = StoryPlayer.CSS;
    document.head.appendChild(s);
  }

  // ---------- lifecycle ----------

  start(entryId, startState = null) {
    this._entryId = (entryId !== undefined && entryId !== null) ? entryId : this.story.entry;
    this.state = {
      inventory: startState && startState.inventory ? new Set(startState.inventory) : new Set(),
      knowledge: startState && startState.knowledge ? new Set(startState.knowledge) : new Set(),
      missions: startState && startState.missions ? new Map(Object.entries(startState.missions)) : new Map(),
      diary: [],
      scores: {}
    };
    if (startState) {
      if (startState.inventory && startState.inventory.length) {
        this.state.diary.push("Started with items: " + startState.inventory.join(", "));
      }
      if (startState.knowledge && startState.knowledge.length) {
        // One entry each, so every preset flag can show its own description
        startState.knowledge.forEach(k => {
          this.state.diary.push({ label: "Started knowing: " + k, key: k });
        });
      }
      if (startState.missions) {
        Object.entries(startState.missions).forEach(([name, status]) => {
          this.state.diary.push(`Mission "${name}" preset to: ${status}`);
        });
      }
    }
    this._stopAllAudio();
    if (this.opts.standalone && !this._begun) {
      this._renderSplash();
    } else {
      this._begin();
    }
  }

  destroy() {
    this._stopAllAudio();
    this.container.innerHTML = "";
    this.container.classList.remove("sp-root");
  }

  _begin() {
    this._begun = true;
    this._buildShell();
    const entryNode = this._node(this._entryId);
    if (!entryNode) {
      this._renderEnding("This story has no scenes yet. Add a Dialogue node in the editor to begin.");
      return;
    }
    this._goto(this._entryId);
  }

  _renderSplash() {
    this.container.classList.add("sp-root");
    this.container.innerHTML = `
      <div class="sp-splash">
        <div class="sp-splash-sub">A Story</div>
        <div class="sp-splash-title">${this._esc(this.story.title || "Untitled Story")}</div>
        <button class="sp-begin">Begin</button>
      </div>`;
    this.container.querySelector(".sp-begin").onclick = () => this._begin();
  }

  _buildShell() {
    this.container.classList.add("sp-root");
    this.container.innerHTML = `
      <div class="sp-bg"></div>
      <div class="sp-vignette"></div>
      <div class="sp-topbar">
        <div class="sp-title">${this._esc(this.story.title || "Untitled Story")}</div>
        <div class="sp-hud">
          <div class="sp-inv"><span>&#128188;</span><span class="sp-inv-items"><span class="sp-inv-empty">empty</span></span></div>
          <button class="sp-hud-btn sp-btn-missions">&#9873; Missions <span class="sp-badge">0</span></button>
          <button class="sp-hud-btn sp-btn-diary">&#128214; Diary</button>
          <button class="sp-hud-btn sp-btn-restart" title="Restart story">&#8635;</button>
          ${this.opts.onExit ? '<button class="sp-hud-btn sp-btn-exit">&#10005; Exit</button>' : ""}
        </div>
      </div>
      <div class="sp-panel sp-hidden sp-missions-panel">
        <div class="sp-panel-head"><span>Missions</span><button class="sp-panel-x">&times;</button></div>
        <div class="sp-panel-body"></div>
      </div>
      <div class="sp-panel sp-hidden sp-diary-panel">
        <div class="sp-panel-head"><span>Diary</span><button class="sp-panel-x">&times;</button></div>
        <div class="sp-panel-body"></div>
      </div>
      <div class="sp-toasts"></div>
      <div class="sp-stage"></div>`;

    const q = sel => this.container.querySelector(sel);
    this.el = {
      bg: q(".sp-bg"),
      stage: q(".sp-stage"),
      inv: q(".sp-inv-items"),
      missionsBtn: q(".sp-btn-missions"),
      missionsBadge: q(".sp-btn-missions .sp-badge"),
      missionsPanel: q(".sp-missions-panel"),
      diaryPanel: q(".sp-diary-panel"),
      toasts: q(".sp-toasts")
    };

    this.el.missionsBtn.onclick = () => this._togglePanel(this.el.missionsPanel);
    q(".sp-btn-diary").onclick = () => this._togglePanel(this.el.diaryPanel);
    q(".sp-btn-restart").onclick = () => this.start(this.story.entry);
    this.el.missionsPanel.querySelector(".sp-panel-x").onclick = () => this.el.missionsPanel.classList.add("sp-hidden");
    this.el.diaryPanel.querySelector(".sp-panel-x").onclick = () => this.el.diaryPanel.classList.add("sp-hidden");
    if (this.opts.onExit) q(".sp-btn-exit").onclick = () => this.opts.onExit();
    this._updateHUD();
  }

  _togglePanel(panel) {
    const others = [this.el.missionsPanel, this.el.diaryPanel].filter(p => p !== panel);
    others.forEach(p => p.classList.add("sp-hidden"));
    panel.classList.toggle("sp-hidden");
    this._renderPanels();
  }

  // ---------- graph walking ----------

  _node(id) { return (id === null || id === undefined) ? null : this.story.nodes[id]; }

  _goto(id) {
    const node = this._node(id);
    if (!node) { this._renderEnding("The narrative reaches a quiet end. Thank you for playing."); return; }
    this._currentId = id;
    switch (node.type) {
      case "dialogue": return this._playDialogue(node);
      case "choice": return this._playChoice(node);
      case "traversal": return this._playTraversal(node, id);
      case "logic": return this._playLogic(node);
      default: return this._playDialogue(node);
    }
  }

  _out(node, slot) {
    const t = node.out && node.out[slot];
    return (t === undefined || t === null) ? null : t;
  }

  // ---------- dialogue ----------

  _playDialogue(node) {
    const p = node.p || {};
    this._setBackground(p.background);
    if (p.audioLoop) this._setLoop(p.audioLoop);
    if (p.audioOneShot) this._playOneShot(p.audioOneShot);

    // Rewards & mission transitions on entering the node
    if (p.rewardItems && !this.state.inventory.has(p.rewardItems)) {
      this.state.inventory.add(p.rewardItems);
      this._toast("Acquired: " + p.rewardItems);
    }
    if (p.rewardKnowledge && !this.state.knowledge.has(p.rewardKnowledge)) {
      this.state.knowledge.add(p.rewardKnowledge);
      // Keep the key alongside the label so the diary can show what the author
      // wrote about this flag, not just that it was found
      this.state.diary.push({ label: 'Discovered: "' + p.rewardKnowledge + '"', key: p.rewardKnowledge });
      this._toast("Diary updated", "info");
    }
    if (p.startMission) this._acceptMission(p.startMission);
    if (p.completeMission) this._completeMission(p.completeMission);
    this._updateHUD();

    this._queue = String(p.text || "...").split("\n").map(l => l.trim()).filter(Boolean);
    if (this._queue.length === 0) this._queue = ["..."];
    this._queueIdx = 0;
    this._renderLine(node);
  }

  _renderLine(node) {
    const p = node.p || {};
    const line = this._queue[this._queueIdx];
    const parsed = this._parseLine(line);
    const last = this._queueIdx >= this._queue.length - 1;

    let charImgHtml = "";
    if (p.showCharacterImages !== false && parsed.speaker) {
      const charMeta = this.story.varMeta && this.story.varMeta.characters && this.story.varMeta.characters[parsed.speaker];
      const charImg = charMeta && charMeta.image;
      if (charImg) {
        charImgHtml = `<div class="sp-char-container"><img class="sp-char-img" src="${this._esc(charImg)}" alt="${this._esc(parsed.speaker)}"></div>`;
      }
    }

    this.el.stage.innerHTML = `
      ${charImgHtml}
      <div class="sp-dialogue">
        ${parsed.speaker ? `<div class="sp-speaker" style="color:${this._charColor(parsed.speaker)}">${this._esc(parsed.speaker)}</div>` : ""}
        <div class="sp-text">${this._richText(parsed.text)}</div>
        <div class="sp-next">${last ? "click to continue" : `next (${this._queueIdx + 1}/${this._queue.length})`} &#8250;</div>
      </div>`;
    this.el.stage.querySelector(".sp-dialogue").onclick = () => {
      if (this._queueIdx < this._queue.length - 1) {
        this._queueIdx++;
        this._renderLine(node);
      } else {
        this._goto(this._out(node, 0));
      }
    };
  }

  // Accepts "{Name}: text", "{Name} text", "Name: text"
  _parseLine(line) {
    let m = line.match(/^\{([^}]+)\}\s*:?\s*(.*)$/s);
    if (m) return { speaker: m[1].trim(), text: m[2] };
    m = line.match(/^([A-Za-z][A-Za-z0-9 .'\-]{0,28}?)\s*:\s+(.*)$/s);
    if (m) return { speaker: m[1].trim(), text: m[2] };
    return { speaker: null, text: line };
  }

  _richText(text) {
    // Inline {Token} references get colored
    let html = this._esc(text);
    html = html.replace(/\{([^}]+)\}/g, (_, name) =>
      `<span class="sp-tok" style="color:${this._charColor(name)}">${name}</span>`);
    return html;
  }

  _charColor(name) {
    const n = String(name).toLowerCase().trim();
    if (n === "narrator") return "#94a3b8";
    let h = 0;
    for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360}, 70%, 68%)`;
  }

  // ---------- choice ----------

  _playChoice(node) {
    const p = node.p || {};
    this._setBackground(p.background);
    if (p.audioLoop) this._setLoop(p.audioLoop);
    if (p.audioOneShot) this._playOneShot(p.audioOneShot);

    const choices = p.choices || [];
    let html = `
      <div class="sp-dialogue" style="cursor:default; min-height:auto;">
        <div class="sp-speaker" style="color:#94a3b8;">Narrator</div>
        <div class="sp-text">${this._richText(p.title || "What will you do?")}</div>
      </div>
      <div class="sp-choices">`;
    choices.forEach((c, i) => {
      const ok = this._evalCond(c.condition);
      const missionBadge = c.mission ? `<span class="sp-choice-mission">&#9873; ${this._esc(c.mission)}</span>` : "";
      if (ok) {
        html += `<button class="sp-choice" data-i="${i}">${this._esc(c.text)}${missionBadge}</button>`;
      } else {
        html += `<button class="sp-choice sp-locked" disabled>${this._esc(c.text)}${missionBadge}<span class="sp-lock-why">requires: ${this._esc(c.condition)}</span></button>`;
      }
    });
    html += "</div>";
    this.el.stage.innerHTML = html;
    this.el.stage.querySelectorAll(".sp-choice:not(.sp-locked)").forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.i, 10);
        const choice = choices[i];
        if (choice.mission) this._acceptMission(choice.mission);
        this._updateHUD();
        this._goto(this._out(node, i));
      };
    });
    this._updateHUD();
  }

  // ---------- traversal (dice maze) ----------

  _playTraversal(node, id) {
    const p = node.p || {};
    this._setBackground(p.background);
    if (p.audioLoop) this._setLoop(p.audioLoop);
    if (p.audioOneShot) this._playOneShot(p.audioOneShot);

    const key = "n" + id;
    if (this.state.scores[key] === undefined) this.state.scores[key] = 0;
    const target = p.targetAccumulation || 100;
    const outcomes = p.outcomes || [];
    const earlyExitSlot = outcomes.length + 1;
    const hasEarlyExit = this._out(node, earlyExitSlot) !== null;

    let risksHtml = "";
    if (outcomes.length) {
      risksHtml = `<div class="sp-dice-risks">
        ${outcomes.map(o => `<div><span>&bull; ${this._esc(o.label)}</span><span class="sp-risk-pct">${o.probability}%</span></div>`).join("")}
      </div>`;
    }

    this.el.stage.innerHTML = `
      <div class="sp-dice">
        <div class="sp-dice-title">${this._esc(p.title || "Maze Challenge")}</div>
        <div class="sp-dice-score">Progress: <b class="sp-score-val">${this.state.scores[key]}</b> / ${target}</div>
        <div class="sp-cube">?</div>
        <button class="sp-roll-btn">Roll d20</button>
        ${hasEarlyExit ? '<button class="sp-exit-btn">&#128682; Take the early exit &mdash; leave before risking another roll</button>' : ""}
        <div class="sp-dice-desc">Each roll adds points toward escape&hellip; but every roll is a risk.</div>
        ${risksHtml}
      </div>`;

    const cube = this.el.stage.querySelector(".sp-cube");
    const btn = this.el.stage.querySelector(".sp-roll-btn");
    const desc = this.el.stage.querySelector(".sp-dice-desc");
    const scoreEl = this.el.stage.querySelector(".sp-score-val");
    const exitBtn = this.el.stage.querySelector(".sp-exit-btn");
    if (exitBtn) exitBtn.onclick = () => this._goto(this._out(node, earlyExitSlot));

    btn.onclick = () => {
      btn.disabled = true;
      if (exitBtn) exitBtn.disabled = true;
      cube.classList.add("sp-rolling");
      cube.textContent = "?";
      setTimeout(() => {
        cube.classList.remove("sp-rolling");
        const roll = Math.floor(Math.random() * 20) + 1;
        cube.textContent = roll;

        let triggered = null;
        for (const o of outcomes) {
          const chance = o.probability !== undefined ? o.probability : 10;
          if (Math.random() * 100 < chance) { triggered = o; break; }
        }

        if (triggered) {
          desc.innerHTML = `<span style="color:#f87171;font-weight:600;">${this._esc(triggered.label)}!</span> ${this._esc(triggered.description || "")}`;
          setTimeout(() => {
            const slot = outcomes.indexOf(triggered) + 1;
            const targetId = this._out(node, slot);
            if (targetId !== null) {
              this._goto(targetId);
            } else {
              this._toast("Event path not connected — restarting room", "info");
              this.state.scores[key] = 0;
              this._playTraversal(node, id);
            }
          }, 1800);
          return;
        }

        this.state.scores[key] += roll;
        scoreEl.textContent = this.state.scores[key];
        if (this.state.scores[key] >= target) {
          desc.innerHTML = `<span style="color:#34d399;font-weight:600;">You made it out! (+${roll})</span>`;
          setTimeout(() => this._goto(this._out(node, 0)), 1300);
        } else {
          desc.textContent = `Rolled ${roll} — keep going to reach ${target}.`;
          btn.disabled = false;
          if (exitBtn) exitBtn.disabled = false;
        }
      }, 700);
    };
  }

  // ---------- logic gate ----------

  _playLogic(node) {
    const ok = this._evalCond((node.p || {}).condition);
    this._goto(this._out(node, ok ? 0 : 1));
  }

  // ---------- missions ----------

  _acceptMission(name) {
    if (!name || this.state.missions.has(name)) return;
    this.state.missions.set(name, "active");
    this._toast("Mission accepted: " + name, "mission");
    this._pulseMissions();
  }

  _completeMission(name) {
    if (!name) return;
    if (this.state.missions.get(name) === "done") return;
    this.state.missions.set(name, "done");
    this._toast("Mission complete: " + name, "mission");
    this._pulseMissions();
  }

  _missionMeta(name) {
    const vm = this.story.varMeta || {};
    return (vm.missions && vm.missions[name]) || {};
  }

  _knowledgeMeta(name) {
    const vm = this.story.varMeta || {};
    return (vm.knowledge && vm.knowledge[name]) || {};
  }

  _pulseMissions() {
    this._updateHUD();
    if (!this.el) return;
    this.el.missionsBtn.classList.add("sp-attn");
    setTimeout(() => this.el.missionsBtn && this.el.missionsBtn.classList.remove("sp-attn"), 2600);
  }

  // ---------- conditions ----------
  // Supported: has_item('x')  has_knowledge('x')  mission_active('x')  mission_done('x')
  // Multiple checks in one expression are ANDed together.

  _evalCond(cond) {
    if (!cond || !String(cond).trim()) return true;
    let ok = true;
    const scan = (fnName, test) => {
      const re = new RegExp(fnName + "\\(['\"]([^'\"]+)['\"]\\)", "g");
      let m;
      while ((m = re.exec(cond))) { if (!test(m[1])) ok = false; }
    };
    scan("has_item", v => this.state.inventory.has(v));
    scan("has_knowledge", v => this.state.knowledge.has(v));
    scan("mission_active", v => this.state.missions.get(v) === "active");
    scan("mission_done", v => this.state.missions.get(v) === "done");
    return ok;
  }

  // ---------- HUD, panels, endings ----------

  _updateHUD() {
    if (!this.el) return;
    // Inventory
    if (this.state.inventory.size === 0) {
      this.el.inv.innerHTML = '<span class="sp-inv-empty">empty</span>';
    } else {
      this.el.inv.innerHTML = Array.from(this.state.inventory)
        .map(i => `<span class="sp-inv-chip">${this._esc(i)}</span>`).join("");
    }
    // Missions badge counts active only
    let active = 0;
    this.state.missions.forEach(v => { if (v === "active") active++; });
    this.el.missionsBadge.textContent = active;
    this._renderPanels();
  }

  _renderPanels() {
    if (!this.el) return;
    // Missions panel
    const mBody = this.el.missionsPanel.querySelector(".sp-panel-body");
    if (this.state.missions.size === 0) {
      mBody.innerHTML = '<div class="sp-panel-empty">No missions accepted yet.</div>';
    } else {
      let html = "";
      this.state.missions.forEach((status, name) => {
        const meta = this._missionMeta(name);
        const done = status === "done";
        html += `
          <div class="sp-mission ${meta.required ? "sp-required" : ""} ${done ? "sp-done" : ""}">
            <div class="sp-mission-name">
              <span>${this._esc(name)}</span>
              ${done
                ? '<span class="sp-mission-tag sp-donetag">done</span>'
                : (meta.required ? '<span class="sp-mission-tag sp-req">required</span>' : '<span class="sp-mission-tag sp-opt">optional</span>')}
            </div>
            ${meta.info ? `<div class="sp-mission-info">${this._esc(meta.info)}</div>` : ""}
          </div>`;
      });
      mBody.innerHTML = html;
    }
    // Diary panel
    const dBody = this.el.diaryPanel.querySelector(".sp-panel-body");
    dBody.innerHTML = this.state.diary.length
      ? this.state.diary.map(e => {
          // Entries are {label, key}; bare strings are still accepted
          const entry = (typeof e === "string") ? { label: e } : (e || {});
          const info = entry.key ? this._knowledgeMeta(entry.key).info : "";
          return `<div class="sp-diary-entry">
            <div class="sp-diary-label">${this._esc(entry.label || "")}</div>
            ${info ? `<div class="sp-diary-info">${this._esc(info)}</div>` : ""}
          </div>`;
        }).join("")
      : '<div class="sp-panel-empty">Nothing discovered yet.</div>';
  }

  _renderEnding(message) {
    if (!this.el) this._buildShell();
    // Any required missions left unfinished?
    let unfinished = [];
    this.state.missions.forEach((status, name) => {
      if (status !== "done" && this._missionMeta(name).required) unfinished.push(name);
    });
    const missionNote = unfinished.length
      ? `<div style="color:#f87171; font-size:13px; margin-bottom:16px;">Unfinished required missions: ${unfinished.map(n => this._esc(n)).join(", ")}</div>`
      : "";
    this.el.stage.innerHTML = `
      <div class="sp-ending">
        <div class="sp-ending-title">&#10022; The End &#10022;</div>
        <div class="sp-ending-text">${this._esc(message)}</div>
        ${missionNote}
        <div class="sp-ending-actions">
          <button class="sp-roll-btn" style="width:auto;" data-act="restart">Play Again</button>
          ${this.opts.onExit ? '<button class="sp-exit-btn" style="width:auto;" data-act="exit">Back to Editor</button>' : ""}
        </div>
      </div>`;
    this.el.stage.querySelector('[data-act="restart"]').onclick = () => this.start(this.story.entry);
    const ex = this.el.stage.querySelector('[data-act="exit"]');
    if (ex) ex.onclick = () => this.opts.onExit();
  }

  // ---------- background & audio ----------

  _setBackground(value) {
    if (!this.el) return;
    const v = String(value || "").trim();
    let css;
    if (!v) {
      css = "linear-gradient(135deg, #1e1b4b, #0f172a)";
    } else if (v.includes("gradient(")) {
      css = v;
      // blob: has no file extension, so it needs the protocol test — the editor
      // resolves project-folder images to blob URLs for playback
    } else if (/^(blob:|data:|https?:|\.{0,2}\/)/.test(v) || /\.(png|jpe?g|gif|webp|avif)$/i.test(v)) {
      css = `url("${v.replace(/"/g, '%22')}")`;
    } else {
      css = "linear-gradient(135deg, #1e1b4b, #0f172a)";
    }
    this.el.bg.style.backgroundImage = css;
  }

  _setLoop(src) {
    if (!src || src === this._loopSrc) return;
    this._loopSrc = src;
    if (this._fadeTimer) { clearInterval(this._fadeTimer); this._fadeTimer = null; }
    const old = this._loopAudio;
    const next = new Audio(src);
    next.loop = true;
    next.volume = 0;
    const p = next.play();
    if (p && p.catch) p.catch(() => {});
    this._loopAudio = next;
    // Crossfade over ~700ms
    let step = 0;
    this._fadeTimer = setInterval(() => {
      step++;
      const t = Math.min(1, step / 14);
      next.volume = t;
      if (old) old.volume = Math.max(0, 1 - t);
      if (t >= 1) {
        clearInterval(this._fadeTimer);
        this._fadeTimer = null;
        if (old) { old.pause(); old.src = ""; }
      }
    }, 50);
  }

  _playOneShot(src) {
    if (!src) return;
    const a = new Audio(src);
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  }

  _stopAllAudio() {
    if (this._fadeTimer) { clearInterval(this._fadeTimer); this._fadeTimer = null; }
    if (this._loopAudio) { this._loopAudio.pause(); this._loopAudio.src = ""; this._loopAudio = null; }
    this._loopSrc = null;
  }

  // ---------- misc ----------

  _toast(msg, kind) {
    if (!this.el) return;
    const t = document.createElement("div");
    t.className = "sp-toast" + (kind ? " sp-toast-" + kind : "");
    t.textContent = msg;
    this.el.toasts.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  _esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
}
new StoryPlayer(document.getElementById("story_root"), STORY, { standalone: true }).start(STORY.entry);
</script>
