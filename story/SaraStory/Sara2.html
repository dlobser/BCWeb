<script>
var STORY = {"title":"Little Sara in Rainbow Land","entry":1,"vars":{"characters":["Sara","Tiger","Dinosaur","Kitty","Moss"],"locations":["Sara's Bedroom","Rainbow Gate","Tall Grass Hill","Jelly Canyon","Bus Stop","Rainbow Bus","Kitty Rooftops","Cloud Party Field","Teacup Garden","Shell Theater"],"collectibles":["red_ribbon","striped_feather","dino_scale","tiny_bell","party_hat","tea_spoon","star_ticket"],"knowledge":["knows_tiger_song","knows_dino_stomp","knows_bus_route","knows_kitty_password"],"missions":["Bring a Gift to the Party","Find the Kitty","Get to the Show on Time"]},"varMeta":{"characters":{"Sara":{"info":"A small girl, about three, with round cheeks and short dark hair cut straight across her forehead. She wears a yellow dress with white polka dots, red rain boots, and a red ribbon in her hair. She carries a tiny brown satchel that is always a little too full.","image":"assets/characters/sara-cutout.png","imageName":"sara-cutout.png"},"Tiger":{"info":"A big soft orange tiger with wide black stripes and a creamy white belly. His eyes are green and sleepy. He is the size of a pony and he wears a blue scarf tied loosely around his neck. He hums when he walks.","image":"assets/characters/tiger-cutout.png","imageName":"tiger-cutout.png"},"Dinosaur":{"info":"A long-necked green dinosaur with pale yellow spots down his back and a row of shiny plates like flat seashells. He is as tall as a house but he moves very slowly and very carefully. He has small friendly eyes and a wide flat smile.","image":"assets/characters/dinosaur-cutout.png","imageName":"dinosaur-cutout.png"},"Kitty":{"info":"A little white cat with one grey ear and one grey sock. She has bright yellow eyes and a bell on a red string. She is always three rooftops ahead.","image":"assets/characters/kitty-cutout.png","imageName":"kitty-cutout.png"},"Moss":{"info":"The bus driver. A tall round man with a green cap, a green coat with brass buttons, and a bushy grey moustache. He has a bell on a rope by his seat and he rings it for no reason at all.","image":"assets/characters/moss-cutout.png","imageName":"moss-cutout.png"}},"locations":{"Sara's Bedroom":{"info":"A small bedroom with striped wallpaper, a wooden bed with a patchwork quilt, and a round window. Toys sit in a basket by the door. Morning light comes in soft and pale.","background":"assets/backgrounds/sara-s-bedroom-2.png","backgroundName":"sara-s-bedroom.png"},"Rainbow Gate":{"info":"A tall archway made of seven curving bands of color, standing all alone in a field of short blue grass. Beyond it the sky is pink and the clouds are shaped like scoops of ice cream. A wooden signpost leans beside it with three painted arrows.","background":"assets/backgrounds/rainbow-gate.png","backgroundName":"rainbow-gate.png"},"Tall Grass Hill":{"info":"A rolling green hill covered in grass taller than Sara. The grass sways in slow waves. Orange poppies poke out here and there, and butterflies drift above like floating confetti.","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png"},"Jelly Canyon":{"info":"A wide canyon with soft wobbly walls in strawberry pink and grape purple. The ground bounces a little when you step. Round jelly boulders quiver in the sunshine.","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png"},"Bus Stop":{"info":"A little red bench under a striped umbrella, standing at the edge of a checkerboard road. A round sign on a pole says BUS in cheerful letters. Daisies grow through the cracks.","background":"assets/backgrounds/bus-stop.png","backgroundName":"bus-stop.png"},"Rainbow Bus":{"info":"A tall double-decker bus painted in seven stripes, with big round headlights like eyes and an open top deck full of wooden seats. Bunting flaps along the railing. Inside it smells like warm bread.","background":"assets/backgrounds/rainbow-bus.png","backgroundName":"rainbow-bus.png"},"Kitty Rooftops":{"info":"A jumble of crooked rooftops in red, blue, and yellow tile, close enough to step between. Laundry lines cross overhead with socks and sheets flapping. Chimneys puff tiny clouds shaped like hearts.","background":"assets/backgrounds/kitty-rooftops.png","backgroundName":"kitty-rooftops.png"},"Cloud Party Field":{"info":"A wide flat meadow of white clouds with a long table down the middle, covered in cakes and paper cups. Balloons on ribbons bob everywhere. Lanterns hang from nothing at all.","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png"},"Teacup Garden":{"info":"A garden where the flowers are teacups on green stems, each one steaming. Little wooden stepping stones wind between them. A round table sits in the middle under a striped awning.","background":"assets/backgrounds/teacup-garden.png","backgroundName":"teacup-garden.png"},"Shell Theater":{"info":"A great pink seashell opened to the sky, with rows of smooth stone seats inside. A curtain of blue silk hangs across the front. Fireflies sit along the edges like little lamps.","background":"assets/backgrounds/shell-theater.png","backgroundName":"shell-theater.png"}},"collectibles":{"red_ribbon":{"info":"A short red satin ribbon with slightly frayed ends, tied in a soft bow."},"striped_feather":{"info":"A long feather striped orange and black like a tiger, curling at the tip."},"dino_scale":{"info":"A flat round scale the size of a saucer, pale green and shiny like the inside of a shell."},"tiny_bell":{"info":"A small brass bell on a red string. It makes a very quiet, very happy sound."},"party_hat":{"info":"A cone hat of folded paper, gold with silver stars, with a puff of blue tissue on top."},"tea_spoon":{"info":"A little silver spoon with a daisy pressed into the handle."},"star_ticket":{"info":"A square paper ticket, deep blue, with one gold star punched right through the middle."}},"knowledge":{"knows_tiger_song":{"info":"Sara knows the Tiger's humming song, the one that goes low and then high and then low again."},"knows_dino_stomp":{"info":"Sara knows how to stomp the way the Dinosaur stomps: slow, slow, quick, and then a little hop."},"knows_bus_route":{"info":"Sara knows every stop on the Rainbow Bus route, in order, by heart."},"knows_kitty_password":{"info":"Sara knows the sound the Kitty answers to. It is not a word. It is two small squeaks."}},"missions":{"Bring a Gift to the Party":{"info":"Everyone at the cloud party brings something to put on the gift table. Sara needs to find one good thing to bring."},"Find the Kitty":{"info":"A little white cat ran along the rooftops. Sara wants to catch up and say hello."},"Get to the Show on Time":{"info":"There is a show tonight inside the great pink shell. Sara has a ticket and the curtain will not wait."}}},"nodes":{"1":{"type":"dialogue","p":{"title":"The Door in the Wallpaper","location":"Sara's Bedroom","charactersPresent":"","text":"Narrator: Sara woke up early. The house was still quiet.\nNarrator: There was a door in the wallpaper that was not there yesterday.\nSara: Oh.\nNarrator: She tied her red ribbon in her hair. She put on her red boots.\nSara: I will only go a little way.\nNarrator: She opened the door.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sara-s-bedroom-2.png","backgroundName":"sara-s-bedroom.png","showCharacterImages":true,"rewardItems":"red_ribbon","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[2]},"2":{"type":"dialogue","p":{"title":"Rainbow Land","location":"Rainbow Gate","charactersPresent":"","text":"Narrator: The grass was blue. The clouds were pink.\nNarrator: A big gate stood in the field with all the colors in it.\nNarrator: On the gate was a sign. The sign said PARTY TODAY, BRING ONE GOOD THING.\nSara: One good thing?\nNarrator: Sara looked in her pocket. There was nothing in it but a crumb.\nSara: I will find one.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/rainbow-gate.png","backgroundName":"rainbow-gate.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"Bring a Gift to the Party","completeMission":"","isChapterStart":false},"out":[3]},"3":{"type":"choice","p":{"title":"Three arrows. Which way?","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"The tall grass","condition":"","mission":""},{"text":"The wobbly canyon","condition":"","mission":""},{"text":"The bus stop","condition":"","mission":""}],"text":""},"out":[4,15,26]},"4":{"type":"dialogue","p":{"title":"Something Orange in the Grass","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: The grass was taller than Sara. It went swish, swish.\nNarrator: Something orange moved. Then it hummed.\nTiger: Low. High. Low.\nSara: Hello?\nNarrator: A big tiger sat down in front of her and yawned.\nTiger: I am not hungry. I am bored.\nSara: I am Sara.\nTiger: Hum with me, Sara.\nNarrator: Sara hummed. Low. High. Low. She knew the song now.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"knows_tiger_song","startMission":"","completeMission":"","isChapterStart":false},"out":[5]},"5":{"type":"choice","p":{"title":"What should Sara do?","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Sing with Tiger","condition":"","mission":""},{"text":"Play hide and seek","condition":"","mission":""},{"text":"Give Tiger the ribbon","condition":"has_item('red_ribbon')","mission":""}],"text":""},"out":[6,7,6]},"6":{"type":"dialogue","p":{"title":"The Humming Song","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: They sang until the poppies shook.\nTiger: That was a very good noise.\nNarrator: Tiger reached behind his ear and pulled out a long striped feather.\nTiger: Here. For you.\nSara: For me?\nTiger: For you.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"striped_feather","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[11]},"7":{"type":"traversal","p":{"title":"Hide and Seek in the Tall Grass","location":"Tall Grass Hill","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":40,"outcomes":[{"label":"Butterflies","probability":8,"description":"A hundred butterflies go up all at once."},{"label":"A soft place","probability":6,"description":"Sara finds a flat warm spot and sits down in it."}],"text":""},"out":[8,9,10,11]},"8":{"type":"dialogue","p":{"title":"Found Him","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: Sara pushed the grass apart. There was a tail. Then a paw. Then a whole tiger.\nSara: Found you!\nTiger: You did. Nobody ever does.\nNarrator: He shook himself, and a striped feather came loose and floated down.\nNarrator: Sara caught it.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"striped_feather","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[11]},"9":{"type":"dialogue","p":{"title":"All the Butterflies","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: Sara stepped, and the air went up.\nNarrator: Butterflies. Orange ones and white ones and one very small blue one.\nSara: Oh! Oh!\nNarrator: The blue one sat on her nose for one whole second.\nNarrator: Then they were gone, and the grass was quiet again.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[11]},"10":{"type":"dialogue","p":{"title":"A Soft Warm Place","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: The grass here was flat and warm, like somebody big had been sleeping.\nNarrator: Sara sat down in it.\nNarrator: Something went ting.\nNarrator: It was a tiny bell on a red string, lost in the grass.\nSara: Somebody will want this.\nNarrator: She put it in her pocket.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"tiny_bell","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[11]},"11":{"type":"logic","p":{"title":"Does Sara have a gift?","condition":"has_item('striped_feather')","location":"","text":""},"out":[12,13]},"12":{"type":"dialogue","p":{"title":"One Good Thing","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: Sara held up the striped feather.\nSara: Is this one good thing?\nTiger: It is a very good thing.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[14]},"13":{"type":"dialogue","p":{"title":"Tiger Picks One","location":"Tall Grass Hill","charactersPresent":"","text":"Sara: I still have nothing to bring.\nNarrator: Tiger thought about it for a long time. Then he pulled a striped feather from behind his ear.\nTiger: Now you do.\nSara: Thank you, Tiger.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"striped_feather","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[14]},"14":{"type":"dialogue","p":{"title":"Walking with Tiger","location":"Tall Grass Hill","charactersPresent":"","text":"Narrator: Tiger stood up. He was very big when he stood up.\nTiger: I know where the party is. Hold my scarf.\nNarrator: Sara held the blue scarf. They walked up the hill and over it.\nNarrator: The clouds began under their feet.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/tall-grass-hill.png","backgroundName":"tall-grass-hill.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[37]},"15":{"type":"dialogue","p":{"title":"The Wobbly Canyon","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: The ground here was pink and it wobbled.\nNarrator: Boom. Boom. Boom.\nSara: That is a big sound.\nNarrator: A long green neck came around the corner. Then the rest of him.\nDinosaur: Hello, small one. Do not worry. I am slow.\nSara: I am Sara.\nDinosaur: Watch my feet, Sara. Slow. Slow. Quick. And a hop.\nNarrator: Sara watched. Then she did it too. Slow. Slow. Quick. Hop.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"knows_dino_stomp","startMission":"","completeMission":"","isChapterStart":false},"out":[16]},"16":{"type":"choice","p":{"title":"What should Sara do?","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Climb on his back","condition":"","mission":""},{"text":"Stomp together","condition":"","mission":""}],"text":""},"out":[17,18]},"17":{"type":"dialogue","p":{"title":"Up on the Dinosaur","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: Dinosaur put his head down flat on the ground.\nDinosaur: Walk up. Take your time.\nNarrator: Sara walked up his nose, up his neck, and sat between two shiny plates.\nNarrator: Then he stood up.\nSara: Ohhhh.\nNarrator: She could see the whole canyon. She could see the clouds. She could see very far.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[19]},"18":{"type":"dialogue","p":{"title":"Slow, Slow, Quick, Hop","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: They stomped together. Slow. Slow. Quick. Hop.\nNarrator: The jelly boulders wobbled. The canyon walls wobbled.\nNarrator: Sara laughed so hard she sat down.\nNarrator: Something flat and green landed beside her. It was one of his scales.\nDinosaur: Keep it. I have too many.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"dino_scale","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[19]},"19":{"type":"traversal","p":{"title":"The Long Walk Through the Canyon","location":"Jelly Canyon","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":40,"outcomes":[{"label":"Wobbly bridge","probability":7,"description":"A bridge of pink jelly shakes under their feet."},{"label":"A round stone egg","probability":6,"description":"There is something smooth half buried in the sand."}],"text":""},"out":[22,20,21,22]},"20":{"type":"dialogue","p":{"title":"The Wobbly Bridge","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: The bridge was made of jelly and it went boing when they stepped.\nSara: Boing.\nDinosaur: Boing.\nSara: Boing boing boing.\nNarrator: They crossed very slowly and it took a long happy time.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[22]},"21":{"type":"dialogue","p":{"title":"The Smooth Round Thing","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: Sara dug with both hands.\nNarrator: It was not an egg. It was a big flat scale, old and shiny like the inside of a shell.\nDinosaur: That one is very old. Older than me.\nSara: Can I keep it?\nDinosaur: Yes.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"dino_scale","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[22]},"22":{"type":"logic","p":{"title":"Does Sara have a gift?","condition":"has_item('dino_scale')","location":"","text":""},"out":[23,24]},"23":{"type":"dialogue","p":{"title":"One Good Thing","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: Sara held the scale up to the sun. It went green, then gold, then green again.\nSara: Is this one good thing?\nDinosaur: That is a very good thing.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[25]},"24":{"type":"dialogue","p":{"title":"The Dinosaur Shrugs","location":"Jelly Canyon","charactersPresent":"","text":"Sara: I have nothing to bring to the party.\nNarrator: Dinosaur shrugged, very slowly, and one shiny scale slid off his back and landed in the sand.\nDinosaur: Oops.\nSara: Oops?\nDinosaur: Oops. You had better take it.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"dino_scale","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[25]},"25":{"type":"dialogue","p":{"title":"Carried to the Clouds","location":"Jelly Canyon","charactersPresent":"","text":"Narrator: Dinosaur put his head down again.\nDinosaur: Up you get. It is a long way and I am slow.\nNarrator: Sara climbed up and held on to a plate.\nNarrator: Boom. Boom. Boom.\nNarrator: The canyon got small behind them and the clouds got close.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/jelly-canyon.png","backgroundName":"jelly-canyon.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[37]},"26":{"type":"dialogue","p":{"title":"Waiting at the Bus Stop","location":"Bus Stop","charactersPresent":"","text":"Narrator: There was a red bench and a striped umbrella and a sign that said BUS.\nNarrator: Sara sat down and swung her boots.\nNarrator: Ding ding!\nNarrator: A bus came around the corner with all the colors painted on it.\nMoss: Rainbow Bus! Grass Hill, Jelly Canyon, Rooftops, Cloud Field!\nSara: All of those?\nMoss: All of those, twice a day. Hop on.\nNarrator: Sara said the stops after him until she knew them.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/bus-stop.png","backgroundName":"bus-stop.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"knows_bus_route","startMission":"","completeMission":"","isChapterStart":false},"out":[27]},"27":{"type":"choice","p":{"title":"Where should Sara sit?","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Up on the top deck","condition":"","mission":""},{"text":"By the window","condition":"","mission":""}],"text":""},"out":[28,29]},"28":{"type":"dialogue","p":{"title":"The Top Deck","location":"Rainbow Bus","charactersPresent":"","text":"Narrator: Sara climbed the little twisty stairs. There was no roof at all.\nNarrator: The wind took her hair and the bunting went flap flap flap.\nSara: I can see everything!\nNarrator: She could see the hill. She could see the pink canyon. She could see the clouds.\nNarrator: Moss rang his bell down below for no reason.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/rainbow-bus.png","backgroundName":"rainbow-bus.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[30]},"29":{"type":"dialogue","p":{"title":"By the Window","location":"Rainbow Bus","charactersPresent":"","text":"Narrator: Sara pressed her nose on the glass.\nNarrator: Something white ran along the rooftops, quick as anything.\nSara: A kitty!\nNarrator: The kitty stopped. It looked right at Sara. It went squeak, squeak.\nNarrator: Sara said squeak, squeak, back to it.\nNarrator: The kitty ran on, but Sara remembered the sound.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/rainbow-bus.png","backgroundName":"rainbow-bus.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"knows_kitty_password","startMission":"","completeMission":"","isChapterStart":false},"out":[30]},"30":{"type":"choice","p":{"title":"The bus is coming to the rooftops.","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Squeak, squeak","condition":"has_knowledge('knows_kitty_password')","mission":"Find the Kitty"},{"text":"Stay on the bus","condition":"","mission":""}],"text":""},"out":[31,35]},"31":{"type":"dialogue","p":{"title":"Off at the Rooftops","location":"Kitty Rooftops","charactersPresent":"","text":"Narrator: Sara said squeak, squeak, and far away something answered.\nSara: Stop the bus, please!\nMoss: Ding ding! Rooftops!\nNarrator: Sara stepped off onto a red tile roof. The bus rolled away without her.\nNarrator: The roofs went up and down like waves.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/kitty-rooftops.png","backgroundName":"kitty-rooftops.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[32]},"32":{"type":"traversal","p":{"title":"Over the Rooftops","location":"Kitty Rooftops","background":"assets/backgrounds/kitty-rooftops.png","backgroundName":"kitty-rooftops.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":30,"outcomes":[{"label":"The laundry line","probability":8,"description":"Sara walks into a wall of clean white sheets."},{"label":"Pigeons","probability":7,"description":"Every pigeon on the roof goes up at once."}],"text":""},"out":[34,33,34,35]},"33":{"type":"dialogue","p":{"title":"Sheets and Socks","location":"Kitty Rooftops","charactersPresent":"","text":"Narrator: The sheets were big and white and warm from the sun.\nNarrator: Sara pushed through one. Then another. Then another.\nSara: Where is the sky?\nNarrator: She pushed through the last one and there was the sky, and a very surprised sock on her head.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/kitty-rooftops.png","backgroundName":"kitty-rooftops.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[34]},"34":{"type":"dialogue","p":{"title":"Found You, Kitty","location":"Kitty Rooftops","charactersPresent":"","text":"Narrator: On the last chimney sat a small white cat with one grey ear.\nNarrator: Sara sat down very slowly and said squeak, squeak.\nKitty: Squeak.\nNarrator: The kitty walked over and put her head under Sara's hand.\nKitty: You are slow. But you came.\nNarrator: Her bell was loose on its red string. It came off in Sara's hand.\nKitty: Keep it. I have another.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/kitty-rooftops.png","backgroundName":"kitty-rooftops.png","showCharacterImages":true,"rewardItems":"tiny_bell","rewardKnowledge":"","startMission":"","completeMission":"Find the Kitty","isChapterStart":false},"out":[35]},"35":{"type":"dialogue","p":{"title":"The Last Stop","location":"Rainbow Bus","charactersPresent":"","text":"Narrator: Ding ding!\nNarrator: The bus came back around and Moss opened the door.\nMoss: Cloud Field! Last stop! Everybody out for the party!\nNarrator: The road ended and the clouds began.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/rainbow-bus.png","backgroundName":"rainbow-bus.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[36]},"36":{"type":"dialogue","p":{"title":"Moss Folds a Hat","location":"Rainbow Bus","charactersPresent":"","text":"Sara: I did not bring one good thing.\nNarrator: Moss took a gold ticket off his pile and folded it, and folded it, and folded it.\nNarrator: It was a hat with silver stars on it and a blue puff on top.\nMoss: Now you did.\nSara: Thank you, Moss.\nMoss: Ding ding.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/rainbow-bus.png","backgroundName":"rainbow-bus.png","showCharacterImages":true,"rewardItems":"party_hat","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[37]},"37":{"type":"dialogue","p":{"title":"The Cloud Party","location":"Cloud Party Field","charactersPresent":"","text":"Narrator: The field was made of clouds and it was soft under her boots.\nNarrator: There was a long table with cakes on it. There were balloons on strings.\nNarrator: There were lanterns hanging from nothing at all.\nNarrator: Everybody was already there, and everybody said hello at once.\nSara: Hello! Hello! Hello!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[38]},"38":{"type":"logic","p":{"title":"Does Sara know the humming song?","condition":"has_knowledge('knows_tiger_song')","location":"","text":""},"out":[39,40]},"39":{"type":"dialogue","p":{"title":"The Humming Part of the Party","location":"Cloud Party Field","charactersPresent":"","text":"Narrator: Tiger climbed up on the table, which he was not supposed to do.\nTiger: Low. High. Low.\nSara: Low! High! Low!\nNarrator: Everybody hummed. The balloons hummed too, a little.\nNarrator: A cake fell over and nobody minded.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[43]},"40":{"type":"logic","p":{"title":"Does Sara know the stomp?","condition":"has_knowledge('knows_dino_stomp')","location":"","text":""},"out":[41,42]},"41":{"type":"dialogue","p":{"title":"The Stomping Part of the Party","location":"Cloud Party Field","charactersPresent":"","text":"Narrator: Dinosaur put one foot down. Slow.\nNarrator: Sara put one foot down. Slow.\nNarrator: Quick. And a hop.\nNarrator: The whole cloud bounced. Everybody came off the ground a little bit.\nSara: Again!","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[43]},"42":{"type":"dialogue","p":{"title":"The Noisy Part of the Party","location":"Cloud Party Field","charactersPresent":"","text":"Narrator: Moss drove the bus right up onto the cloud, which you are allowed to do.\nNarrator: He pressed the horn. It played seven notes, one for each color.\nNarrator: Everybody marched behind the bus around the whole table twice.\nNarrator: Sara marched at the front.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[43]},"43":{"type":"dialogue","p":{"title":"The Gift Table","location":"Cloud Party Field","charactersPresent":"","text":"Narrator: At the end of the table was a small table just for good things.\nNarrator: Sara put her one good thing down on it, right in the middle.\nSara: There.\nNarrator: Everybody clapped.\nNarrator: Then somebody put a blue paper ticket in her hand. It had a gold star punched through it.\nSara: What is this for?\nKitty: The show. In the shell. When it gets dark.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png","showCharacterImages":true,"rewardItems":"star_ticket","rewardKnowledge":"","startMission":"Get to the Show on Time","completeMission":"Bring a Gift to the Party","isChapterStart":false},"out":[44]},"44":{"type":"choice","p":{"title":"What should Sara do now?","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"Tea in the garden","condition":"","mission":""},{"text":"Go to the show","condition":"has_item('star_ticket')","mission":""},{"text":"Go home","condition":"","mission":""}],"text":""},"out":[45,51,55]},"45":{"type":"dialogue","p":{"title":"The Teacup Garden","location":"Teacup Garden","charactersPresent":"","text":"Narrator: Down the cloud steps was a garden where the flowers were teacups.\nNarrator: Every cup was steaming a little.\nKitty: Do not pick the green ones. They are too hot.\nSara: Which one is mine?\nKitty: The one you get to.\nNarrator: There was a little silver spoon on the path. Sara picked it up.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/teacup-garden.png","backgroundName":"teacup-garden.png","showCharacterImages":true,"rewardItems":"tea_spoon","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[46]},"46":{"type":"traversal","p":{"title":"Hopping to the Table","location":"Teacup Garden","background":"assets/backgrounds/teacup-garden.png","backgroundName":"teacup-garden.png","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","targetAccumulation":30,"outcomes":[{"label":"The sugar slide","probability":8,"description":"A whole hill of sugar, and it is slippery."},{"label":"The honey puddle","probability":6,"description":"Sara steps in something very slow and very sweet."}],"text":""},"out":[49,47,48,49]},"47":{"type":"dialogue","p":{"title":"Down the Sugar Hill","location":"Teacup Garden","charactersPresent":"","text":"Narrator: Sara stepped on a white hill and the white hill went whoosh.\nSara: Whooooa!\nNarrator: She slid all the way to the bottom and sat down in a pile of sugar.\nKitty: That is the fast way.\nSara: I know.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/teacup-garden.png","backgroundName":"teacup-garden.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[49]},"48":{"type":"dialogue","p":{"title":"Stuck in the Honey","location":"Teacup Garden","charactersPresent":"","text":"Narrator: One boot would not come up.\nSara: Oh no.\nNarrator: She pulled. And pulled. And pulled.\nNarrator: The boot came up all at once and Sara sat down backwards in the daisies.\nNarrator: Kitty licked the honey off the boot, which was helpful.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/teacup-garden.png","backgroundName":"teacup-garden.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[49]},"49":{"type":"dialogue","p":{"title":"Tea Time","location":"Teacup Garden","charactersPresent":"","text":"Narrator: The round table had four chairs and every chair was full.\nNarrator: Sara stirred her cup with the little silver spoon.\nSara: It tastes like a raspberry.\nKitty: Mine tastes like a fish.\nSara: That is not the same thing at all.\nKitty: No. But we both like ours.\nNarrator: The sky went from pink to purple. Somewhere far off, a bell rang once.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/teacup-garden.png","backgroundName":"teacup-garden.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[50]},"50":{"type":"logic","p":{"title":"Does Sara have her ticket?","condition":"has_item('star_ticket')","location":"","text":""},"out":[51,55]},"51":{"type":"dialogue","p":{"title":"Inside the Shell","location":"Shell Theater","charactersPresent":"","text":"Narrator: The shell was pink and enormous and open to the sky.\nNarrator: A girl at the front looked at Sara's ticket and gave it back with a hole in it.\nNarrator: Sara sat on a smooth stone seat that was still warm from the day.\nNarrator: The fireflies dimmed themselves, all together, without anybody asking.\nNarrator: The blue curtain went up.\nNarrator: It was a show about a girl who found a door in her wallpaper.\nSara: Hey.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/shell-theater.png","backgroundName":"shell-theater.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"Get to the Show on Time","isChapterStart":false},"out":[52]},"52":{"type":"choice","p":{"title":"The curtain comes down.","location":"","background":"","backgroundName":"","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","choices":[{"text":"One more song","condition":"","mission":""},{"text":"Time to go home","condition":"","mission":""}],"text":""},"out":[53,55]},"53":{"type":"dialogue","p":{"title":"One More","location":"Shell Theater","charactersPresent":"","text":"Narrator: Everybody stayed in their seats and nobody moved.\nSara: One more! One more!\nTiger: One more.\nDinosaur: One more, but a quiet one.\nNarrator: So they did a quiet one, with just the fireflies and the humming.\nNarrator: Low. High. Low.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/shell-theater.png","backgroundName":"shell-theater.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[54]},"54":{"type":"dialogue","p":{"title":"The Walk Back","location":"Cloud Party Field","charactersPresent":"","text":"Narrator: They all walked back across the cloud field together.\nNarrator: The lanterns were still hanging from nothing at all.\nNarrator: Tiger carried Kitty. Dinosaur carried Tiger. Nobody carried Dinosaur.\nNarrator: Moss rang his bell, very softly, so as not to wake the clouds.\nSara: That was the best day.\nKitty: It was a normal day.\nSara: It was the best one.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/cloud-party-field.png","backgroundName":"cloud-party-field.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[55]},"55":{"type":"dialogue","p":{"title":"Home Again","location":"Sara's Bedroom","charactersPresent":"","text":"Narrator: The door in the wallpaper was still open, just a little.\nNarrator: Sara went through it and her bed was right there, exactly where she left it.\nNarrator: She took off her red boots. There was sugar in one of them.\nNarrator: She put her one good thing on the shelf, where she could see it.\nSara: Goodnight, Rainbow Land.\nNarrator: And somewhere very far away, something went squeak, squeak.","audioLoop":"","audioLoopName":"","audioOneShot":"","audioOneShotName":"","background":"assets/backgrounds/sara-s-bedroom-2.png","backgroundName":"sara-s-bedroom.png","showCharacterImages":true,"rewardItems":"","rewardKnowledge":"","startMission":"","completeMission":"","isChapterStart":false},"out":[]}}};

.sp-toast.sp-toast-info { background:rgba(99,102,241,.94); }

.sp-splash { position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; background:radial-gradient(ellipse at center, #131627 0%, #05060a 75%); }
.sp-splash-title { font-family:'EB Garamond',Georgia,serif; font-size:clamp(34px, 6vw, 62px); color:#fff; text-align:center; letter-spacing:1px; text-shadow:0 4px 30px rgba(99,102,241,.5); padding:0 20px; }
.sp-splash-sub { color:#94a3b8; font-size:13px; letter-spacing:3px; text-transform:uppercase; }
.sp-begin { background:linear-gradient(135deg,#6366f1,#a855f7); color:#fff; border:none; border-radius:34px; padding:15px 52px; font-size:17px; font-family:'EB Garamond',Georgia,serif; letter-spacing:1px; cursor:pointer; box-shadow:0 10px 34px rgba(99,102,241,.45); transition:.2s ease; }
.sp-begin:hover { transform:translateY(-2px); box-shadow:0 14px 44px rgba(99,102,241,.65); }

.sp-ending { width:min(600px,92%); background:rgba(14,16,24,.92); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:36px; text-align:center; box-shadow:0 16px 44px rgba(0,0,0,.6); animation:spFadeIn .4s ease; margin-bottom:10vh; }
.sp-ending-title { font-family:'EB Garamond',Georgia,serif; font-size:30px; color:#34d399; margin-bottom:14px; }
.sp-ending-text { font-family:'EB Garamond',Georgia,serif; font-size:17px; color:#cbd5e1; line-height:1.6; margin-bottom:24px; }
.sp-ending-actions { display:flex; gap:12px; justify-content:center; }

.sp-char-container { display:flex; justify-content:center; align-items:flex-end; width:min(860px, 92%); height:min(480px, 48vh); pointer-events:none; margin-bottom:12px; z-index:5; }
.sp-char-img { max-height:100%; max-width:66%; object-fit:contain; animation:spSlideUp .4s ease; }
@keyframes spSlideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
`;

  constructor(container, story, opts = {}) {
    this.container = container;
    this.story = story || { nodes: {}, vars: {}, entry: null };
    this.opts = opts; // { onExit: fn, standalone: bool }
    this.state = null;
    this._loopAudio = null;
    this._loopSrc = null;
    this._fadeTimer = null;
    this._begun = false;
    this._injectStyles();
  }

  _injectStyles() {
    if (document.getElementById("sp-player-styles")) return;
    const s = document.createElement("style");
    s.id = "sp-player-styles";
    s.textContent = StoryPlayer.CSS;
    document.head.appendChild(s);
  }

  // ---------- lifecycle ----------

  start(entryId, startState = null) {
    this._entryId = (entryId !== undefined && entryId !== null) ? entryId : this.story.entry;
    this.state = {
      inventory: startState && startState.inventory ? new Set(startState.inventory) : new Set(),
      knowledge: startState && startState.knowledge ? new Set(startState.knowledge) : new Set(),
      missions: startState && startState.missions ? new Map(Object.entries(startState.missions)) : new Map(),
      diary: [],
      scores: {}
    };
    if (startState) {
      if (startState.inventory && startState.inventory.length) {
        this.state.diary.push("Started with items: " + startState.inventory.join(", "));
      }
      if (startState.knowledge && startState.knowledge.length) {
        // One entry each, so every preset flag can show its own description
        startState.knowledge.forEach(k => {
          this.state.diary.push({ label: "Started knowing: " + k, key: k });
        });
      }
      if (startState.missions) {
        Object.entries(startState.missions).forEach(([name, status]) => {
          this.state.diary.push(`Mission "${name}" preset to: ${status}`);
        });
      }
    }
    this._stopAllAudio();
    if (this.opts.standalone && !this._begun) {
      this._renderSplash();
    } else {
      this._begin();
    }
  }

  destroy() {
    this._stopAllAudio();
    this.container.innerHTML = "";
    this.container.classList.remove("sp-root");
  }

  _begin() {
    this._begun = true;
    this._buildShell();
    const entryNode = this._node(this._entryId);
    if (!entryNode) {
      this._renderEnding("This story has no scenes yet. Add a Dialogue node in the editor to begin.");
      return;
    }
    this._goto(this._entryId);
  }

  _renderSplash() {
    this.container.classList.add("sp-root");
    this.container.innerHTML = `
      <div class="sp-splash">
        <div class="sp-splash-sub">A Story</div>
        <div class="sp-splash-title">${this._esc(this.story.title || "Untitled Story")}</div>
        <button class="sp-begin">Begin</button>
      </div>`;
    this.container.querySelector(".sp-begin").onclick = () => this._begin();
  }

  _buildShell() {
    this.container.classList.add("sp-root");
    this.container.innerHTML = `
      <div class="sp-bg"></div>
      <div class="sp-vignette"></div>
      <div class="sp-topbar">
        <div class="sp-title">${this._esc(this.story.title || "Untitled Story")}</div>
        <div class="sp-hud">
          <div class="sp-inv"><span>&#128188;</span><span class="sp-inv-items"><span class="sp-inv-empty">empty</span></span></div>
          <button class="sp-hud-btn sp-btn-missions">&#9873; Missions <span class="sp-badge">0</span></button>
          <button class="sp-hud-btn sp-btn-diary">&#128214; Diary</button>
          <button class="sp-hud-btn sp-btn-restart" title="Restart story">&#8635;</button>
          ${this.opts.onExit ? '<button class="sp-hud-btn sp-btn-exit">&#10005; Exit</button>' : ""}
        </div>
      </div>
      <div class="sp-panel sp-hidden sp-missions-panel">
        <div class="sp-panel-head"><span>Missions</span><button class="sp-panel-x">&times;</button></div>
        <div class="sp-panel-body"></div>
      </div>
      <div class="sp-panel sp-hidden sp-diary-panel">
        <div class="sp-panel-head"><span>Diary</span><button class="sp-panel-x">&times;</button></div>
        <div class="sp-panel-body"></div>
      </div>
      <div class="sp-toasts"></div>
      <div class="sp-stage"></div>`;

    const q = sel => this.container.querySelector(sel);
    this.el = {
      bg: q(".sp-bg"),
      stage: q(".sp-stage"),
      inv: q(".sp-inv-items"),
      missionsBtn: q(".sp-btn-missions"),
      missionsBadge: q(".sp-btn-missions .sp-badge"),
      missionsPanel: q(".sp-missions-panel"),
      diaryPanel: q(".sp-diary-panel"),
      toasts: q(".sp-toasts")
    };

    this.el.missionsBtn.onclick = () => this._togglePanel(this.el.missionsPanel);
    q(".sp-btn-diary").onclick = () => this._togglePanel(this.el.diaryPanel);
    q(".sp-btn-restart").onclick = () => this.start(this.story.entry);
    this.el.missionsPanel.querySelector(".sp-panel-x").onclick = () => this.el.missionsPanel.classList.add("sp-hidden");
    this.el.diaryPanel.querySelector(".sp-panel-x").onclick = () => this.el.diaryPanel.classList.add("sp-hidden");
    if (this.opts.onExit) q(".sp-btn-exit").onclick = () => this.opts.onExit();
    this._updateHUD();
  }

  _togglePanel(panel) {
    const others = [this.el.missionsPanel, this.el.diaryPanel].filter(p => p !== panel);
    others.forEach(p => p.classList.add("sp-hidden"));
    panel.classList.toggle("sp-hidden");
    this._renderPanels();
  }

  // ---------- graph walking ----------

  _node(id) { return (id === null || id === undefined) ? null : this.story.nodes[id]; }

  _goto(id) {
    const node = this._node(id);
    if (!node) { this._renderEnding("The narrative reaches a quiet end. Thank you for playing."); return; }
    this._currentId = id;
    switch (node.type) {
      case "dialogue": return this._playDialogue(node);
      case "choice": return this._playChoice(node);
      case "traversal": return this._playTraversal(node, id);
      case "logic": return this._playLogic(node);
      default: return this._playDialogue(node);
    }
  }

  _out(node, slot) {
    const t = node.out && node.out[slot];
    return (t === undefined || t === null) ? null : t;
  }

  // ---------- dialogue ----------

  _playDialogue(node) {
    const p = node.p || {};
    this._setBackground(p.background);
    if (p.audioLoop) this._setLoop(p.audioLoop);
    if (p.audioOneShot) this._playOneShot(p.audioOneShot);

    // Rewards & mission transitions on entering the node
    if (p.rewardItems && !this.state.inventory.has(p.rewardItems)) {
      this.state.inventory.add(p.rewardItems);
      this._toast("Acquired: " + p.rewardItems);
    }
    if (p.rewardKnowledge && !this.state.knowledge.has(p.rewardKnowledge)) {
      this.state.knowledge.add(p.rewardKnowledge);
      // Keep the key alongside the label so the diary can show what the author
      // wrote about this flag, not just that it was found
      this.state.diary.push({ label: 'Discovered: "' + p.rewardKnowledge + '"', key: p.rewardKnowledge });
      this._toast("Diary updated", "info");
    }
    if (p.startMission) this._acceptMission(p.startMission);
    if (p.completeMission) this._completeMission(p.completeMission);
    this._updateHUD();

    this._queue = String(p.text || "...").split("\n").map(l => l.trim()).filter(Boolean);
    if (this._queue.length === 0) this._queue = ["..."];
    this._queueIdx = 0;
    this._renderLine(node);
  }

  _renderLine(node) {
    const p = node.p || {};
    const line = this._queue[this._queueIdx];
    const parsed = this._parseLine(line);
    const last = this._queueIdx >= this._queue.length - 1;

    let charImgHtml = "";
    if (p.showCharacterImages !== false && parsed.speaker) {
      const charMeta = this.story.varMeta && this.story.varMeta.characters && this.story.varMeta.characters[parsed.speaker];
      const charImg = charMeta && charMeta.image;
      if (charImg) {
        charImgHtml = `<div class="sp-char-container"><img class="sp-char-img" src="${this._esc(charImg)}" alt="${this._esc(parsed.speaker)}"></div>`;
      }
    }

    this.el.stage.innerHTML = `
      ${charImgHtml}
      <div class="sp-dialogue">
        ${parsed.speaker ? `<div class="sp-speaker" style="color:${this._charColor(parsed.speaker)}">${this._esc(parsed.speaker)}</div>` : ""}
        <div class="sp-text">${this._richText(parsed.text)}</div>
        <div class="sp-next">${last ? "click to continue" : `next (${this._queueIdx + 1}/${this._queue.length})`} &#8250;</div>
      </div>`;
    this.el.stage.querySelector(".sp-dialogue").onclick = () => {
      if (this._queueIdx < this._queue.length - 1) {
        this._queueIdx++;
        this._renderLine(node);
      } else {
        this._goto(this._out(node, 0));
      }
    };
  }

  // Accepts "{Name}: text", "{Name} text", "Name: text"
  _parseLine(line) {
    let m = line.match(/^\{([^}]+)\}\s*:?\s*(.*)$/s);
    if (m) return { speaker: m[1].trim(), text: m[2] };
    m = line.match(/^([A-Za-z][A-Za-z0-9 .'\-]{0,28}?)\s*:\s+(.*)$/s);
    if (m) return { speaker: m[1].trim(), text: m[2] };
    return { speaker: null, text: line };
  }

  _richText(text) {
    // Inline {Token} references get colored
    let html = this._esc(text);
    html = html.replace(/\{([^}]+)\}/g, (_, name) =>
      `<span class="sp-tok" style="color:${this._charColor(name)}">${name}</span>`);
    return html;
  }

  _charColor(name) {
    const n = String(name).toLowerCase().trim();
    if (n === "narrator") return "#94a3b8";
    let h = 0;
    for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
    return `hsl(${h % 360}, 70%, 68%)`;
  }

  // ---------- choice ----------

  _playChoice(node) {
    const p = node.p || {};
    this._setBackground(p.background);
    if (p.audioLoop) this._setLoop(p.audioLoop);
    if (p.audioOneShot) this._playOneShot(p.audioOneShot);

    const choices = p.choices || [];
    let html = `
      <div class="sp-dialogue" style="cursor:default; min-height:auto;">
        <div class="sp-speaker" style="color:#94a3b8;">Narrator</div>
        <div class="sp-text">${this._richText(p.title || "What will you do?")}</div>
      </div>
      <div class="sp-choices">`;
    choices.forEach((c, i) => {
      const ok = this._evalCond(c.condition);
      const missionBadge = c.mission ? `<span class="sp-choice-mission">&#9873; ${this._esc(c.mission)}</span>` : "";
      if (ok) {
        html += `<button class="sp-choice" data-i="${i}">${this._esc(c.text)}${missionBadge}</button>`;
      } else {
        html += `<button class="sp-choice sp-locked" disabled>${this._esc(c.text)}${missionBadge}<span class="sp-lock-why">requires: ${this._esc(c.condition)}</span></button>`;
      }
    });
    html += "</div>";
    this.el.stage.innerHTML = html;
    this.el.stage.querySelectorAll(".sp-choice:not(.sp-locked)").forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.i, 10);
        const choice = choices[i];
        if (choice.mission) this._acceptMission(choice.mission);
        this._updateHUD();
        this._goto(this._out(node, i));
      };
    });
    this._updateHUD();
  }

  // ---------- traversal (dice maze) ----------

  _playTraversal(node, id) {
    const p = node.p || {};
    this._setBackground(p.background);
    if (p.audioLoop) this._setLoop(p.audioLoop);
    if (p.audioOneShot) this._playOneShot(p.audioOneShot);

    const key = "n" + id;
    if (this.state.scores[key] === undefined) this.state.scores[key] = 0;
    const target = p.targetAccumulation || 100;
    const outcomes = p.outcomes || [];
    const earlyExitSlot = outcomes.length + 1;
    const hasEarlyExit = this._out(node, earlyExitSlot) !== null;

    let risksHtml = "";
    if (outcomes.length) {
      risksHtml = `<div class="sp-dice-risks">
        ${outcomes.map(o => `<div><span>&bull; ${this._esc(o.label)}</span><span class="sp-risk-pct">${o.probability}%</span></div>`).join("")}
      </div>`;
    }

    this.el.stage.innerHTML = `
      <div class="sp-dice">
        <div class="sp-dice-title">${this._esc(p.title || "Maze Challenge")}</div>
        <div class="sp-dice-score">Progress: <b class="sp-score-val">${this.state.scores[key]}</b> / ${target}</div>
        <div class="sp-cube">?</div>
        <button class="sp-roll-btn">Roll d20</button>
        ${hasEarlyExit ? '<button class="sp-exit-btn">&#128682; Take the early exit &mdash; leave before risking another roll</button>' : ""}
        <div class="sp-dice-desc">Each roll adds points toward escape&hellip; but every roll is a risk.</div>
        ${risksHtml}
      </div>`;

    const cube = this.el.stage.querySelector(".sp-cube");
    const btn = this.el.stage.querySelector(".sp-roll-btn");
    const desc = this.el.stage.querySelector(".sp-dice-desc");
    const scoreEl = this.el.stage.querySelector(".sp-score-val");
    const exitBtn = this.el.stage.querySelector(".sp-exit-btn");
    if (exitBtn) exitBtn.onclick = () => this._goto(this._out(node, earlyExitSlot));

    btn.onclick = () => {
      btn.disabled = true;
      if (exitBtn) exitBtn.disabled = true;
      cube.classList.add("sp-rolling");
      cube.textContent = "?";
      setTimeout(() => {
        cube.classList.remove("sp-rolling");
        const roll = Math.floor(Math.random() * 20) + 1;
        cube.textContent = roll;

        let triggered = null;
        for (const o of outcomes) {
          const chance = o.probability !== undefined ? o.probability : 10;
          if (Math.random() * 100 < chance) { triggered = o; break; }
        }

        if (triggered) {
          desc.innerHTML = `<span style="color:#f87171;font-weight:600;">${this._esc(triggered.label)}!</span> ${this._esc(triggered.description || "")}`;
          setTimeout(() => {
            const slot = outcomes.indexOf(triggered) + 1;
            const targetId = this._out(node, slot);
            if (targetId !== null) {
              this._goto(targetId);
            } else {
              this._toast("Event path not connected — restarting room", "info");
              this.state.scores[key] = 0;
              this._playTraversal(node, id);
            }
          }, 1800);
          return;
        }

        this.state.scores[key] += roll;
        scoreEl.textContent = this.state.scores[key];
        if (this.state.scores[key] >= target) {
          desc.innerHTML = `<span style="color:#34d399;font-weight:600;">You made it out! (+${roll})</span>`;
          setTimeout(() => this._goto(this._out(node, 0)), 1300);
        } else {
          desc.textContent = `Rolled ${roll} — keep going to reach ${target}.`;
          btn.disabled = false;
          if (exitBtn) exitBtn.disabled = false;
        }
      }, 700);
    };
  }

  // ---------- logic gate ----------

  _playLogic(node) {
    const ok = this._evalCond((node.p || {}).condition);
    this._goto(this._out(node, ok ? 0 : 1));
  }

  // ---------- missions ----------

  _acceptMission(name) {
    if (!name || this.state.missions.has(name)) return;
    this.state.missions.set(name, "active");
    this._toast("Mission accepted: " + name, "mission");
    this._pulseMissions();
  }

  _completeMission(name) {
    if (!name) return;
    if (this.state.missions.get(name) === "done") return;
    this.state.missions.set(name, "done");
    this._toast("Mission complete: " + name, "mission");
    this._pulseMissions();
  }

  _missionMeta(name) {
    const vm = this.story.varMeta || {};
    return (vm.missions && vm.missions[name]) || {};
  }

  _knowledgeMeta(name) {
    const vm = this.story.varMeta || {};
    return (vm.knowledge && vm.knowledge[name]) || {};
  }

  _pulseMissions() {
    this._updateHUD();
    if (!this.el) return;
    this.el.missionsBtn.classList.add("sp-attn");
    setTimeout(() => this.el.missionsBtn && this.el.missionsBtn.classList.remove("sp-attn"), 2600);
  }

  // ---------- conditions ----------
  // Supported: has_item('x')  has_knowledge('x')  mission_active('x')  mission_done('x')
  // Multiple checks in one expression are ANDed together.

  _evalCond(cond) {
    if (!cond || !String(cond).trim()) return true;
    let ok = true;
    const scan = (fnName, test) => {
      const re = new RegExp(fnName + "\\(['\"]([^'\"]+)['\"]\\)", "g");
      let m;
      while ((m = re.exec(cond))) { if (!test(m[1])) ok = false; }
    };
    scan("has_item", v => this.state.inventory.has(v));
    scan("has_knowledge", v => this.state.knowledge.has(v));
    scan("mission_active", v => this.state.missions.get(v) === "active");
    scan("mission_done", v => this.state.missions.get(v) === "done");
    return ok;
  }

  // ---------- HUD, panels, endings ----------

  _updateHUD() {
    if (!this.el) return;
    // Inventory
    if (this.state.inventory.size === 0) {
      this.el.inv.innerHTML = '<span class="sp-inv-empty">empty</span>';
    } else {
      this.el.inv.innerHTML = Array.from(this.state.inventory)
        .map(i => `<span class="sp-inv-chip">${this._esc(i)}</span>`).join("");
    }
    // Missions badge counts active only
    let active = 0;
    this.state.missions.forEach(v => { if (v === "active") active++; });
    this.el.missionsBadge.textContent = active;
    this._renderPanels();
  }

  _renderPanels() {
    if (!this.el) return;
    // Missions panel
    const mBody = this.el.missionsPanel.querySelector(".sp-panel-body");
    if (this.state.missions.size === 0) {
      mBody.innerHTML = '<div class="sp-panel-empty">No missions accepted yet.</div>';
    } else {
      let html = "";
      this.state.missions.forEach((status, name) => {
        const meta = this._missionMeta(name);
        const done = status === "done";
        html += `
          <div class="sp-mission ${meta.required ? "sp-required" : ""} ${done ? "sp-done" : ""}">
            <div class="sp-mission-name">
              <span>${this._esc(name)}</span>
              ${done
                ? '<span class="sp-mission-tag sp-donetag">done</span>'
                : (meta.required ? '<span class="sp-mission-tag sp-req">required</span>' : '<span class="sp-mission-tag sp-opt">optional</span>')}
            </div>
            ${meta.info ? `<div class="sp-mission-info">${this._esc(meta.info)}</div>` : ""}
          </div>`;
      });
      mBody.innerHTML = html;
    }
    // Diary panel
    const dBody = this.el.diaryPanel.querySelector(".sp-panel-body");
    dBody.innerHTML = this.state.diary.length
      ? this.state.diary.map(e => {
          // Entries are {label, key}; bare strings are still accepted
          const entry = (typeof e === "string") ? { label: e } : (e || {});
          const info = entry.key ? this._knowledgeMeta(entry.key).info : "";
          return `<div class="sp-diary-entry">
            <div class="sp-diary-label">${this._esc(entry.label || "")}</div>
            ${info ? `<div class="sp-diary-info">${this._esc(info)}</div>` : ""}
          </div>`;
        }).join("")
      : '<div class="sp-panel-empty">Nothing discovered yet.</div>';
  }

  _renderEnding(message) {
    if (!this.el) this._buildShell();
    // Any required missions left unfinished?
    let unfinished = [];
    this.state.missions.forEach((status, name) => {
      if (status !== "done" && this._missionMeta(name).required) unfinished.push(name);
    });
    const missionNote = unfinished.length
      ? `<div style="color:#f87171; font-size:13px; margin-bottom:16px;">Unfinished required missions: ${unfinished.map(n => this._esc(n)).join(", ")}</div>`
      : "";
    this.el.stage.innerHTML = `
      <div class="sp-ending">
        <div class="sp-ending-title">&#10022; The End &#10022;</div>
        <div class="sp-ending-text">${this._esc(message)}</div>
        ${missionNote}
        <div class="sp-ending-actions">
          <button class="sp-roll-btn" style="width:auto;" data-act="restart">Play Again</button>
          ${this.opts.onExit ? '<button class="sp-exit-btn" style="width:auto;" data-act="exit">Back to Editor</button>' : ""}
        </div>
      </div>`;
    this.el.stage.querySelector('[data-act="restart"]').onclick = () => this.start(this.story.entry);
    const ex = this.el.stage.querySelector('[data-act="exit"]');
    if (ex) ex.onclick = () => this.opts.onExit();
  }

  // ---------- background & audio ----------

  _setBackground(value) {
    if (!this.el) return;
    const v = String(value || "").trim();
    let css;
    if (!v) {
      css = "linear-gradient(135deg, #1e1b4b, #0f172a)";
    } else if (v.includes("gradient(")) {
      css = v;
      // blob: has no file extension, so it needs the protocol test — the editor
      // resolves project-folder images to blob URLs for playback
    } else if (/^(blob:|data:|https?:|\.{0,2}\/)/.test(v) || /\.(png|jpe?g|gif|webp|avif)$/i.test(v)) {
      css = `url("${v.replace(/"/g, '%22')}")`;
    } else {
      css = "linear-gradient(135deg, #1e1b4b, #0f172a)";
    }
    this.el.bg.style.backgroundImage = css;
  }

  _setLoop(src) {
    if (!src || src === this._loopSrc) return;
    this._loopSrc = src;
    if (this._fadeTimer) { clearInterval(this._fadeTimer); this._fadeTimer = null; }
    const old = this._loopAudio;
    const next = new Audio(src);
    next.loop = true;
    next.volume = 0;
    const p = next.play();
    if (p && p.catch) p.catch(() => {});
    this._loopAudio = next;
    // Crossfade over ~700ms
    let step = 0;
    this._fadeTimer = setInterval(() => {
      step++;
      const t = Math.min(1, step / 14);
      next.volume = t;
      if (old) old.volume = Math.max(0, 1 - t);
      if (t >= 1) {
        clearInterval(this._fadeTimer);
        this._fadeTimer = null;
        if (old) { old.pause(); old.src = ""; }
      }
    }, 50);
  }

  _playOneShot(src) {
    if (!src) return;
    const a = new Audio(src);
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  }

  _stopAllAudio() {
    if (this._fadeTimer) { clearInterval(this._fadeTimer); this._fadeTimer = null; }
    if (this._loopAudio) { this._loopAudio.pause(); this._loopAudio.src = ""; this._loopAudio = null; }
    this._loopSrc = null;
  }

  // ---------- misc ----------

  _toast(msg, kind) {
    if (!this.el) return;
    const t = document.createElement("div");
    t.className = "sp-toast" + (kind ? " sp-toast-" + kind : "");
    t.textContent = msg;
    this.el.toasts.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  _esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
}
new StoryPlayer(document.getElementById("story_root"), STORY, { standalone: true }).start(STORY.entry);
